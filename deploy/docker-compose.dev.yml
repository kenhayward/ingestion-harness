# Local development overlay: exposes infra ports so `npm run dev:api`, `npm run dev:web`
# and `uv run ingest-worker` can run on the host against containerised Postgres + SeaweedFS.
#
#   deploy/scripts/dev-infra.sh up      (or dev-infra.ps1 on Windows)

services:
  postgres:
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432

  seaweedfs:
    ports:
      - ${SEAWEEDFS_MASTER_BIND:-0.0.0.0}:${SEAWEEDFS_MASTER_PORT:-9334}:9333 # master UI
      - 127.0.0.1:8888:8888 # filer UI (browse buckets)
