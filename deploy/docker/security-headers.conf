# Exposed beyond the LAN (ADR 0006): no MIME sniffing, no referrer leaks, and no framing except by
# the sites FRAME_ANCESTORS names (ADR 0012; the variables come from frame-ancestors.conf.template).
# Included at server level *and* in every location with its own add_header: nginx drops all
# inherited add_header directives in a location that sets any.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options $ih_x_frame_options always;
add_header Content-Security-Policy "frame-ancestors $ih_frame_ancestors" always;
