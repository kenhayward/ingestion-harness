# Exposed beyond the LAN (ADR 0006): no framing, no MIME sniffing, no referrer leaks.
# Included at server level *and* in every location with its own add_header: nginx drops all
# inherited add_header directives in a location that sets any.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
