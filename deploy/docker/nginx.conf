# Keep the scheme NGINX Proxy Manager (or any TLS proxy) saw: the API marks the session cookie
# Secure only for HTTPS requests. Direct LAN access falls back to this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 60m; # keep >= MAX_UPLOAD_MB

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location = /readyz {
    proxy_pass http://api:3000/readyz;
  }

  # Workbench bundle imports: up to MAX_UPLOAD_MB x 12 samples + 8 MB (608 MB at the default 50).
  # Streamed to the API, which enforces the exact limit, instead of buffered to disk here.
  location = /api/workbench/projects/import {
    client_max_body_size 650m;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Live job streams (Server-Sent Events, Home): passed on event by event, never buffered. The
  # API sends a comment every 15 s, well inside the read timeout. nginx hides an upstream's
  # X-Accel-* headers by default: pass the API's X-Accel-Buffering: no on, so an outer nginx
  # (NGINX Proxy Manager) streams too instead of holding every event until the stream ends.
  location ~ ^/api/jobs/[^/]+/events$ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Installed app (docs/design/pwa.md). nginx's mime.types has no .webmanifest, so name its type.
  # The manifest and the service worker are revalidated on every load, so a change reaches
  # installed copies on the browser's next check; the offline page is fetched by the worker.
  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Hashed file names: a new build has new names, so these never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The page names the current build's assets, so browsers must revalidate it on every load;
  # otherwise a cached copy keeps loading the previous build's assets after a deploy.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
