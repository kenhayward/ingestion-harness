# Keep the scheme NGINX Proxy Manager (or any TLS proxy) saw: the API marks the session cookie
# Secure only for HTTPS requests. Direct LAN access falls back to this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Keep >= MAX_UPLOAD_MB: 210 MB fits a 200 MB upload (a large ontology such as ChEBI lite)
  # plus the multipart framing.
  client_max_body_size 210m;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location = /readyz {
    proxy_pass http://api:3000/readyz;
  }

  # Workbench bundle imports: up to MAX_UPLOAD_MB x 12 samples + 8 MB (608 MB at the default 50).
  # With a higher MAX_UPLOAD_MB the API allows more, but bundles still stop here at 650 MB.
  # Streamed to the API, which enforces the exact limit, instead of buffered to disk here.
  location = /api/workbench/projects/import {
    client_max_body_size 650m;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Backup upload (Administration > Backup): 64 MiB parts, streamed to the API like the bundle
  # import, with room for a slow link to finish a part. No trailing '/': nginx answers the bare
  # path of a proxied location ending in '/' with a 301, and POST /api/backup/uploads (the upload
  # start) is that path; a browser's fetch cannot follow it ("Failed to fetch").
  location ^~ /api/backup/uploads {
    client_max_body_size 80m;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
  }

  # Backup download: gigabytes, passed on as they arrive instead of staged in nginx's temp files.
  location ~ ^/api/backup/backups/[^/]+/file$ {
    proxy_buffering off;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
  }

  # Live job streams (Server-Sent Events, Home): passed on event by event, never buffered. The
  # API sends a comment every 15 s, well inside the read timeout. nginx hides an upstream's
  # X-Accel-* headers by default: pass the API's X-Accel-Buffering: no on, so an outer nginx
  # (NGINX Proxy Manager) streams too instead of holding every event until the stream ends.
  location ~ ^/api/jobs/[^/]+/events$ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Installed app (docs/design/pwa.md). nginx's mime.types has no .webmanifest, so name its type.
  # The manifest and the service worker are revalidated on every load, so a change reaches
  # installed copies on the browser's next check; the offline page is fetched by the worker.
  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The dashboard widget page (ADR 0012): a dashboard that copies it onto its own site must frame
  # the app by absolute URL, so its src="/" becomes the origin this request came in on.
  location = /widget.html {
    sub_filter 'src="/"' 'src="$forwarded_proto://$http_host/"';
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Hashed file names: a new build has new names, so these never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The page names the current build's assets, so browsers must revalidate it on every load;
  # otherwise a cached copy keeps loading the previous build's assets after a deploy.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
