# Keep the scheme NGINX Proxy Manager (or any TLS proxy) saw: the API marks the session cookie
# Secure only for HTTPS requests. Direct LAN access falls back to this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 60m; # keep >= MAX_UPLOAD_MB

  # Exposed beyond the LAN (ADR 0006): no framing, no MIME sniffing, no referrer leaks.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location = /readyz {
    proxy_pass http://api:3000/readyz;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
