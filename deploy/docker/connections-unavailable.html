<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connections unavailable · CT Studio bridge</title>
    <!-- nginx serves this on the connections listener while the delivery bridge is down
         (nginx.conf); the bridge's own page.css is not reachable then, so the styles are here. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #0f1b2d;
        --muted: #4f5d70;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121a25;
          --text: #e5ebf2;
          --muted: #9dabbd;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 17px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>The connections page is unavailable right now</h1>
    <p>Close this and try again shortly. Nothing you saved before is lost.</p>
  </body>
</html>
