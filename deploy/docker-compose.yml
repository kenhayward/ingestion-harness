# Production-shaped stack: app (nginx + React) / api (Fastify) / worker (Python) / bridge (the
# delivery bridge every publication goes through) on Postgres + SeaweedFS. Run via deploy/scripts/deploy.sh (or compose.sh for ad-hoc commands).
# Build context is the repo root.

name: ${COMPOSE_PROJECT_NAME:-ingestion}

x-s3-env: &s3-env
  S3_ENDPOINT: http://seaweedfs:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in deploy/.env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in deploy/.env}
  S3_BUCKET_INBOX: ${S3_BUCKET_INBOX:-ingest-inbox}
  S3_BUCKET_OUTPUTS: ${S3_BUCKET_OUTPUTS:-ingest-outputs}
  S3_BUCKET_RUNS: ${S3_BUCKET_RUNS:-ingest-runs}
  # Backups and restore uploads (Administration > Backup); created by init-buckets, never backed up.
  S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-ingest-backups}
  # The `default` publishing target, seeded once; empty endpoint/keys = same SeaweedFS as above.
  # Keys named here are read by the bridge (an env-keyed connection), never stored.
  TARGET_S3_ENDPOINT: ${TARGET_S3_ENDPOINT:-}
  TARGET_S3_REGION: ${TARGET_S3_REGION:-}
  TARGET_S3_ACCESS_KEY: ${TARGET_S3_ACCESS_KEY:-}
  TARGET_S3_SECRET_KEY: ${TARGET_S3_SECRET_KEY:-}
  TARGET_S3_BUCKET: ${TARGET_S3_BUCKET:-ingest-published}
  TARGET_S3_PREFIX: ${TARGET_S3_PREFIX:-}

# The delivery bridge: CT Studio's API and worker sign every request to it with this shared key,
# and it signs its events and handoff calls back with the same one.
x-bridge-env: &bridge-env
  BRIDGE_URL: http://bridge:3100
  BRIDGE_CLIENT_KEY: ${BRIDGE_CLIENT_KEY:?set BRIDGE_CLIENT_KEY in deploy/.env (openssl rand -base64 32)}
  BRIDGE_STAGING_BUCKET: ${BRIDGE_STAGING_BUCKET:-ingest-bridge}
  # Where browsers reach the bridge's connections page: its own origin (recommended), or the
  # /bridge path of this app (the default; weaker, see deploy/README.md).
  BRIDGE_PUBLIC_URL: ${BRIDGE_PUBLIC_URL:-http://localhost:${APP_PORT:-8081}/bridge}
  # The origin people reach this app at: the page, on its own origin, may then be framed by it
  # alone and opens in a modal. Blank: a new tab.
  BRIDGE_APP_ORIGIN: ${BRIDGE_APP_ORIGIN:-}

x-db-env: &db-env
  DATABASE_URL: postgres://${POSTGRES_USER:-ingest}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-ingest}

services:
  postgres:
    # postgres:17-alpine with pgvector (ADR 0011: ontology term embeddings).
    build:
      context: ..
      dockerfile: deploy/docker/postgres.Dockerfile
    image: ingestion-postgres:17-pgvector-0.8.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ingest}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    # Pinned to an exact 4.x release; Dependabot proposes newer 4.x tags (ADR 0008).
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # Render the S3 identity file from env, then run master+volume+filer+s3 in one process.
    # The admin identity is static (the IAM API can't change it); -s3.iam.readOnly=false lets the
    # API manage the data lake's read-only `lake-*` users through the embedded IAM (ADR 0008).
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        sed -e "s|__ACCESS_KEY__|$${S3_ACCESS_KEY}|" -e "s|__SECRET_KEY__|$${S3_SECRET_KEY}|"
        /etc/seaweedfs/s3.json.template > /tmp/s3.json &&
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json -s3.iam.readOnly=false
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
    ports:
      # S3 endpoint for downstream loaders; bound to localhost unless S3_PUBLIC_BIND is set.
      # Publish it through the proxy with the GET/HEAD-only rules in deploy/README.md (ADR 0008).
      - ${S3_PUBLIC_BIND:-127.0.0.1}:${S3_PUBLIC_PORT:-8335}:8333
      # Master UI (unauthenticated); localhost unless SEAWEEDFS_MASTER_BIND is set.
      - ${SEAWEEDFS_MASTER_BIND:-127.0.0.1}:${SEAWEEDFS_MASTER_PORT:-9334}:9333
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30

  fuseki:
    # The triple store (ADR 0011 step 6): Apache Jena Fuseki, TDB2 on the fuseki-data volume.
    # Opt-in: COMPOSE_PROFILES=rdf with RDF_ENDPOINT, RDF_WRITER_PASSWORD and RDF_READER_PASSWORD
    # in deploy/.env (without them the worker writes graphs to S3 only). The worker writes over
    # the internal network `rdf`; consumers read through the host's reverse proxy, which forwards
    # only /ct/sparql and /ct/get to FUSEKI_PUBLIC_PORT (bound to localhost by default; ADR 0011
    # step 7). Backups, compaction and the proxy: deploy/README.md.
    profiles: [rdf]
    image: ${IMAGE_PREFIX:-ingestion-harness}/fuseki:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/fuseki.Dockerfile
    restart: unless-stopped
    environment:
      RDF_WRITER_PASSWORD: ${RDF_WRITER_PASSWORD:-}
      RDF_READER_PASSWORD: ${RDF_READER_PASSWORD:-}
      JAVA_OPTIONS: ${FUSEKI_JAVA_OPTIONS:--Xmx2g}
    volumes:
      - fuseki-data:/fuseki
    networks: [default, rdf]
    ports:
      - ${FUSEKI_BIND:-127.0.0.1}:${FUSEKI_PUBLIC_PORT:-3030}:3030
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3030/$$/ping']
      interval: 10s
      timeout: 5s
      retries: 12

  converter:
    # Word (.docx) to PDF for the worker (docs/design/word-documents.md, ADR 0009): Gotenberg's
    # LibreOffice-only image, pinned to an exact release. It parses untrusted documents, so it
    # sits on an internal network with no route out, publishes no ports, and LibreOffice may
    # not fetch linked content (deny flags) nor Gotenberg download URLs or call webhooks.
    image: gotenberg/gotenberg:8.37.0-libreoffice
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=60s
      - --api-disable-download-from
      - --webhook-disable
      - --libreoffice-deny-private-ips
      - --libreoffice-deny-public-ips
      - --prometheus-disable-collect
    networks: [converter]
    mem_limit: 2g
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  init-buckets:
    image: ${IMAGE_PREFIX:-ingestion-harness}/worker:${IMAGE_TAG:-dev}
    command: ['python', '-m', 'ingest_worker.admin', 'init-buckets']
    environment:
      <<: [*s3-env, *bridge-env]
      DATABASE_URL: unused
    depends_on:
      seaweedfs: { condition: service_healthy }
    restart: 'no'

  migrate:
    image: ${IMAGE_PREFIX:-ingestion-harness}/api:${IMAGE_TAG:-dev}
    command: ['node', 'apps/api/dist/db/migrate-cli.js']
    environment:
      <<: [*db-env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  migrate-bridge:
    image: ${IMAGE_PREFIX:-ingestion-harness}/bridge:${IMAGE_TAG:-dev}
    command: ['node', 'apps/bridge/dist/db/migrate-cli.js']
    environment:
      <<: [*db-env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  bridge:
    # The delivery bridge (docs/adr/0017-delivery-bridge.md): delivers packages to their targets'
    # sinks (S3 and the triple store built in), keeps shared connections encrypted under
    # BRIDGE_SECRETS_KEY, and serves the connections page. No host port: the API and the worker reach it on the compose network,
    # browsers reach only its connections page, through the app's nginx (/bridge/connections) or
    # the page's own origin.
    image: ${IMAGE_PREFIX:-ingestion-harness}/bridge:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/bridge.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env]
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BRIDGE_CLIENT_KEY: ${BRIDGE_CLIENT_KEY:?set BRIDGE_CLIENT_KEY in deploy/.env (openssl rand -base64 32)}
      # Encrypts connection secrets: keep it with LLM_SECRETS_KEY (a restore needs both).
      BRIDGE_SECRETS_KEY: ${BRIDGE_SECRETS_KEY:?set BRIDGE_SECRETS_KEY in deploy/.env (openssl rand -base64 32)}
      BRIDGE_SECRETS_KEY_PREVIOUS: ${BRIDGE_SECRETS_KEY_PREVIOUS:-}
      BRIDGE_EVENTS_URL: http://api:3000/api/bridge/events
      BRIDGE_PRODUCER_URL: http://api:3000/api
      BRIDGE_PUBLIC_URL: ${BRIDGE_PUBLIC_URL:-http://localhost:${APP_PORT:-8081}/bridge}
      BRIDGE_APP_ORIGIN: ${BRIDGE_APP_ORIGIN:-}
      BRIDGE_COOKIE_SECURE: ${BRIDGE_COOKIE_SECURE:-true}
      BRIDGE_STAGING_BUCKET: ${BRIDGE_STAGING_BUCKET:-ingest-bridge}
      # The deployment's S3 as the data lake reaches it: a connection there keeps off the staging
      # bucket and CT Studio's own buckets, like one to S3_ENDPOINT.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # The triple store's writer password, read by the rdf-default connection (only the bridge
      # writes graphs; RDF_ENDPOINT and the user come from the API's mirror of the target).
      RDF_PASSWORD: ${RDF_WRITER_PASSWORD:-}
      # External sinks, each with its own signing key (blank: S3 and the triple store only).
      BRIDGE_SINKS: ${BRIDGE_SINKS:-}
    networks: [default, rdf]
    depends_on:
      migrate-bridge: { condition: service_completed_successfully }
      init-buckets: { condition: service_completed_successfully }
      fuseki: { condition: service_healthy, required: false }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3100/readyz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  fake-sink:
    # Test stacks only (profile fake-sink): an external sink the bridge reaches over the sink
    # contract, for the compose smoke and the conformance suite. Name it in BRIDGE_SINKS with
    # FAKE_SINK_KEY. No host port.
    image: ${IMAGE_PREFIX:-ingestion-harness}/bridge:${IMAGE_TAG:-dev}
    profiles: [fake-sink]
    command: ['node', 'apps/bridge/dist/sinks/fake-server.js']
    environment:
      FAKE_SINK_KEY: ${FAKE_SINK_KEY:-}
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX:-ingestion-harness}/api:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
      args:
        # The build's calendar version (ADR 0014), set by deploy/scripts/deploy.{sh,ps1}.
        APP_VERSION: ${APP_VERSION:-dev}
        APP_VERSION_PREVIOUS: ${APP_VERSION_PREVIOUS:-}
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env, *bridge-env]
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      ONTOLOGY_FETCH_ALLOW: ${ONTOLOGY_FETCH_ALLOW:-}
      ONTOLOGY_MAX_BYTES: ${ONTOLOGY_MAX_BYTES:-104857600}
      LINKED_DATA_CUSTOMER: ${LINKED_DATA_CUSTOMER:-}
      LINKED_DATA_BASE_IRI: ${LINKED_DATA_BASE_IRI:-}
      # Where consumers query the triple store (the proxy); shown on the Linked data page.
      RDF_PUBLIC_URL: ${RDF_PUBLIC_URL:-}
      # Proxies whose X-Forwarded-* the API trusts (empty = private networks; ADR 0006).
      TRUST_PROXY: ${TRUST_PROXY:-}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
      CT_INSTANCE_NAME: ${CT_INSTANCE_NAME:-}
      # URL the data lake reads the publish bucket through (shown with new S3 keys; ADR 0008).
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Encrypts LLM endpoint keys entered on the Models page (ADR 0010); the worker decrypts.
      LLM_SECRETS_KEY: ${LLM_SECRETS_KEY:-}
      LLM_SECRETS_KEY_PREVIOUS: ${LLM_SECRETS_KEY_PREVIOUS:-}
      # The GitHub OAuth app users link their accounts with (Profile); tokens under LLM_SECRETS_KEY.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
      # The triple store a backup dumps and a restore replaces, as the worker writes to it;
      # empty (no rdf profile): backups carry no triples.
      RDF_ENDPOINT: ${RDF_ENDPOINT:-}
      RDF_DATASET: ${RDF_DATASET:-ct}
      RDF_USER: ct-writer
      RDF_PASSWORD: ${RDF_WRITER_PASSWORD:-}
    # `rdf` reaches Fuseki when the rdf profile is on (as for the worker); the network exists either way.
    networks: [default, rdf]
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-buckets: { condition: service_completed_successfully }
      bridge: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/readyz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: ${IMAGE_PREFIX:-ingestion-harness}/worker:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
      args:
        # Recipe plugin packages to install (docs/plugins/writing-plugins.md); empty: none.
        WORKER_PLUGINS: ${WORKER_PLUGINS:-}
        # The build's calendar version (ADR 0014), set by deploy/scripts/deploy.{sh,ps1}.
        APP_VERSION: ${APP_VERSION:-dev}
        APP_VERSION_PREVIOUS: ${APP_VERSION_PREVIOUS:-}
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env, *bridge-env]
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-true}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_RESPONSE_FORMAT: ${LOCAL_LLM_RESPONSE_FORMAT:-json_schema}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_MODEL: ${OCR_MODEL:-local/olmocr-2-7b-1025}
      OCR_BASE_URL: ${OCR_BASE_URL:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      DRAFT_MODEL: ${DRAFT_MODEL:-local/qwen3.8-27b-mtp}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Seeded into the database on start (ADR 0010); an admin's edit there wins.
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      FAST_MODEL: ${FAST_MODEL:-}
      ANTHROPIC_MODELS: ${ANTHROPIC_MODELS:-}
      OPENAI_MODELS: ${OPENAI_MODELS:-}
      LOCAL_LLM_MODELS: ${LOCAL_LLM_MODELS:-}
      LLM_ENDPOINTS: ${LLM_ENDPOINTS:-}
      LLM_CHOICES: ${LLM_CHOICES:-}
      LLM_ENDPOINT_KEYS: ${LLM_ENDPOINT_KEYS:-}
      LLM_SECRETS_KEY: ${LLM_SECRETS_KEY:-}
      LLM_SECRETS_KEY_PREVIOUS: ${LLM_SECRETS_KEY_PREVIOUS:-}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-2}
      DISCOVERY_INTERVAL_S: ${DISCOVERY_INTERVAL_S:-3600}
      # Word (.docx) conversion; empty disables it (Word documents then need review).
      CONVERTER_URL: ${CONVERTER_URL-http://converter:3000}
      ONTOLOGY_MAX_TRIPLES: ${ONTOLOGY_MAX_TRIPLES:-2000000}
      ONTOLOGY_FETCH_ALLOW: ${ONTOLOGY_FETCH_ALLOW:-}
      ONTOLOGY_MAX_BYTES: ${ONTOLOGY_MAX_BYTES:-104857600}
      # The triple store (ADR 0011 step 6), only to seed the rdf-default target: the bridge
      # writes the graphs. Empty: delivered graphs go to S3 only.
      RDF_ENDPOINT: ${RDF_ENDPOINT:-}
      RDF_DATASET: ${RDF_DATASET:-ct}
      # The LangGraph trial (docs/design/langgraph-trial.md): `langgraph` checkpoints a recipe's
      # steps so a stopped job resumes where it stopped; empty: the steps run as before.
      WORKER_STEP_GRAPH: ${WORKER_STEP_GRAPH:-}
    networks: [default, converter]
    extra_hosts:
      - host.docker.internal:host-gateway # reach a local LLM server on the docker host
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-buckets: { condition: service_completed_successfully }
      bridge: { condition: service_healthy }
      converter: { condition: service_healthy }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    stop_grace_period: 2m # let an in-flight extraction finish

  app:
    image: ${IMAGE_PREFIX:-ingestion-harness}/app:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/app.Dockerfile
      args:
        # The build's calendar version (ADR 0014), set by deploy/scripts/deploy.{sh,ps1}.
        APP_VERSION: ${APP_VERSION:-dev}
        APP_VERSION_PREVIOUS: ${APP_VERSION_PREVIOUS:-}
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
    ports:
      - ${APP_BIND:-0.0.0.0}:${APP_PORT:-8081}:80
      # The connections page's own origin (nginx.conf: /connections only). A TLS proxy on this
      # stack's network reaches it as app:8082; one elsewhere needs BRIDGE_PAGE_BIND=0.0.0.0.
      - ${BRIDGE_PAGE_BIND:-127.0.0.1}:${BRIDGE_PAGE_PORT:-8082}:8082
    depends_on:
      api: { condition: service_healthy }
      # nginx resolves the bridge's name when it starts (/bridge/connections).
      bridge: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  # Only the worker and the converter: no route out of it (ADR 0009).
  converter:
    internal: true
  # Only the worker, the API (backup and restore) and Fuseki (ADR 0011).
  rdf:
    internal: true

volumes:
  fuseki-data:
  postgres-data:
  seaweedfs-data:
