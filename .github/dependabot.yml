version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: uv
    directory: /worker
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
