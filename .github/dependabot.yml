version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # The runtime is Node 24 (.nvmrc, node:24-alpine): its types move with it, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Packages that only install or pass together; a dependency joins the first group
      # it matches, so these come before dev-tooling.
      vitest:
        patterns: ['vitest', '@vitest/*']
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint']
      # Minor and patch dev updates together; each major comes as its own PR so one
      # incompatible major (e.g. TypeScript ahead of typescript-eslint) blocks nothing else.
      dev-tooling:
        dependency-type: development
        update-types: ['minor', 'patch']
  - package-ecosystem: uv
    directory: /worker
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: monthly }
  # Compose images (SeaweedFS is pinned to an exact 4.x tag; majors are a deliberate change).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
