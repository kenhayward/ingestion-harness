name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A push to main runs only `tag`: main requires every PR to be up to date and to pass these checks
# (strict required checks, admins included), so the code that lands was tested exactly as it is,
# and re-running the tests would cost ~9 minutes per merge for nothing (ADR 0014).
#
# Pull requests cancel their superseded runs. Every push to main is its own group: GitHub replaces
# a pending run in a shared group even without cancel-in-progress, and a merge whose run never
# finished would never get its calendar tag (job `tag`, ADR 0014).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# All jobs run on self-hosted runners (see docs/runners.md). Labels:
#   ingestion-ci — Linux x64 runner with Docker, used for test + image jobs.
jobs:
  node:
    name: Node (lint, typecheck, test, build)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  worker:
    name: Worker (ruff, mypy, pytest)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.5'
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=ingest_worker --cov-report=term-missing

  stack:
    name: Images + compose smoke test
    needs: [node, worker]
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: ih-ci-${{ github.run_id }}
      IMAGE_PREFIX: ih-ci
      IMAGE_TAG: ${{ github.sha }}
      APP_PORT: '0' # ephemeral host port; resolved below
    steps:
      - uses: actions/checkout@v7
      - name: Prepare env file
        run: |
          cp deploy/.env.example deploy/.env.ci
          sed -i "s/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}/" deploy/.env.ci
          sed -i "s/^IMAGE_PREFIX=.*/IMAGE_PREFIX=${IMAGE_PREFIX}/" deploy/.env.ci
          sed -i "s/^APP_PORT=.*/APP_PORT=0/; s/^S3_PUBLIC_PORT=.*/S3_PUBLIC_PORT=0/; s/^SEAWEEDFS_MASTER_PORT=.*/SEAWEEDFS_MASTER_PORT=0/; s/^FUSEKI_PUBLIC_PORT=.*/FUSEKI_PUBLIC_PORT=0/" deploy/.env.ci
      - name: Build images
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml build
      - name: Start stack
        run: |
          compose() { docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml "$@"; }
          compose up -d postgres seaweedfs
          compose run --rm init-buckets
          compose run --rm migrate
          compose up -d api worker app
          echo "COMPOSE_FUSEKI=$(compose ps -q fuseki)" >> "$GITHUB_ENV"
          echo "APP_URL=http://$(compose port app 80)" >> "$GITHUB_ENV"
          echo "S3_URL=http://$(compose port seaweedfs 8333)" >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          ADMIN_TOKEN="$(deploy/scripts/admin-token.sh --env-file deploy/.env.ci -f deploy/docker-compose.yml)"
          echo "::add-mask::$ADMIN_TOKEN"
          BASE_URL="$APP_URL" S3_URL="$S3_URL" ADMIN_TOKEN="$ADMIN_TOKEN" deploy/scripts/smoke-test.sh
      - name: Triple store smoke test
        run: |
          compose() { docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml "$@"; }
          test -n "$COMPOSE_FUSEKI" || { echo "fuseki did not start (COMPOSE_PROFILES=rdf)"; exit 1; }
          # The worker reaches Fuseki on the internal network as ct-writer: PUT, then DELETE.
          compose exec -T worker python - <<'EOF'
          import os
          from ingest_worker.graph_store import graph_store_from_env
          store = graph_store_from_env(os.environ)
          assert store is not None, "RDF_ENDPOINT is not set"
          graph = "https://smoke.example/graph"
          store.put(graph, b"<https://smoke.example/s> <https://smoke.example/p> 1 .", "text/turtle")
          assert store.delete(graph)
          print("ok   triple store: PUT and DELETE as ct-writer")
          EOF
          compose exec -T fuseki /opt/fuseki/admin.sh backup
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml logs --tail=200
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml down -v --remove-orphans
          docker image ls --filter "reference=${IMAGE_PREFIX}/*:${IMAGE_TAG}" -q | xargs -r docker image rm -f

  tag:
    # The build's calendar version (ADR 0014): every merge to main gets the next YYYY.MM.DD.N tag
    # straight away (its PR passed these checks up to date with main; see the top of the file). No concurrency group (it would replace pending jobs): version.mjs retries
    # with the next number when another run took this one.
    name: Tag the build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kenhayward/ingestion-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Tag
        id: tag
        run: |
          tag="$(node deploy/scripts/version.mjs tag)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "### Tagged ${tag}" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  bridge-release:
    # What external sinks build against (delivery bridge design, "How private sinks get it"): the
    # conformance suite as an image, and the bridge's OpenAPI document on the tag's release.
    name: Bridge contract release assets
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Conformance image
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/ct-bridge-conformance:${TAG}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f deploy/docker/bridge-conformance.Dockerfile -t "${image}" .
          docker push "${image}"
      - name: OpenAPI document on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --notes "Build ${TAG}"
          gh release upload "${TAG}" apps/bridge/openapi.json --clobber
