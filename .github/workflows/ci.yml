name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A push to main runs only `tag`: main requires every PR to be up to date and to pass these checks
# (strict required checks, admins included), so the code that lands was tested exactly as it is,
# and re-running the tests would cost ~9 minutes per merge for nothing (ADR 0014).
#
# Pull requests cancel their superseded runs. Every push to main is its own group: GitHub replaces
# a pending run in a shared group even without cancel-in-progress, and a merge whose run never
# finished would never get its calendar tag (job `tag`, ADR 0014).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# All jobs run on self-hosted runners (see docs/runners.md). Labels:
#   ingestion-ci — Linux x64 runner with Docker, used for test + image jobs.
jobs:
  node:
    name: Node (lint, typecheck, test, build)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  worker:
    name: Worker (ruff, mypy, pytest)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.5'
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=ingest_worker --cov-report=term-missing

  stack:
    name: Images + compose smoke test
    needs: [node, worker]
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: ih-ci-${{ github.run_id }}
      IMAGE_PREFIX: ih-ci
      IMAGE_TAG: ${{ github.sha }}
      APP_PORT: '0' # ephemeral host port; resolved below
    steps:
      - uses: actions/checkout@v7
      - name: Prepare env file
        run: |
          cp deploy/.env.example deploy/.env.ci
          sed -i "s/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}/" deploy/.env.ci
          sed -i "s/^IMAGE_PREFIX=.*/IMAGE_PREFIX=${IMAGE_PREFIX}/" deploy/.env.ci
          sed -i "s/^APP_PORT=.*/APP_PORT=0/; s/^S3_PUBLIC_PORT=.*/S3_PUBLIC_PORT=0/; s/^SEAWEEDFS_MASTER_PORT=.*/SEAWEEDFS_MASTER_PORT=0/; s/^FUSEKI_PUBLIC_PORT=.*/FUSEKI_PUBLIC_PORT=0/" deploy/.env.ci
          # The delivery bridge's two keys (the example leaves them blank: compose refuses that).
          sed -i "s|^BRIDGE_CLIENT_KEY=.*|BRIDGE_CLIENT_KEY=$(openssl rand -base64 32)|; s|^BRIDGE_SECRETS_KEY=.*|BRIDGE_SECRETS_KEY=$(openssl rand -base64 32)|" deploy/.env.ci
          # The fake external sink (profile fake-sink, added to the example's COMPOSE_PROFILES:
          # a --profile flag would replace them and leave Fuseki out), registered with the bridge.
          sed -i "/^COMPOSE_PROFILES=./s/$/,fake-sink/; s/^COMPOSE_PROFILES=$/COMPOSE_PROFILES=fake-sink/" deploy/.env.ci
          fake_key="$(openssl rand -hex 32)"
          sed -i "s|^FAKE_SINK_KEY=.*|FAKE_SINK_KEY=${fake_key}|" deploy/.env.ci
          sed -i "s|^BRIDGE_SINKS=.*|BRIDGE_SINKS=[{\"id\":\"fake\",\"url\":\"http://fake-sink:8080\",\"key\":\"${fake_key}\"}]|" deploy/.env.ci
          echo "FAKE_SINK_KEY=${fake_key}" >> "$GITHUB_ENV"
      - name: Build images
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml build
      - name: Start stack
        run: |
          compose() { docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml "$@"; }
          compose up -d postgres seaweedfs
          compose run --rm init-buckets
          compose run --rm migrate
          compose run --rm migrate-bridge
          # The fake external sink first, so the bridge's start-up describe finds it.
          compose up -d fake-sink
          compose up -d bridge api worker app
          echo "COMPOSE_FUSEKI=$(compose ps -q fuseki)" >> "$GITHUB_ENV"
          echo "APP_URL=http://$(compose port app 80)" >> "$GITHUB_ENV"
          echo "S3_URL=http://$(compose port seaweedfs 8333)" >> "$GITHUB_ENV"
      - name: Conformance suite against the fake external sink
        run: |
          docker build -q -t ih-ci-conformance -f deploy/docker/bridge-conformance.Dockerfile .
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" \
            -e SINK_URL=http://fake-sink:8080 -e SINK_KEY="$FAKE_SINK_KEY" -e SINK_INSTANCE=any \
            -e SINK_DESTINATION='{"space":"conformance","name":"suite"}' ih-ci-conformance
      - name: Smoke test
        run: |
          ADMIN_TOKEN="$(deploy/scripts/admin-token.sh --env-file deploy/.env.ci -f deploy/docker-compose.yml)"
          echo "::add-mask::$ADMIN_TOKEN"
          BASE_URL="$APP_URL" S3_URL="$S3_URL" ADMIN_TOKEN="$ADMIN_TOKEN" SMOKE_EXTERNAL=1 \
            SMOKE_COMPOSE="docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml" \
            deploy/scripts/smoke-test.sh
      - name: Triple store smoke test
        run: |
          compose() { docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml "$@"; }
          test -n "$COMPOSE_FUSEKI" || { echo "fuseki did not start (COMPOSE_PROFILES=rdf)"; exit 1; }
          # Only the bridge writes graphs (delivery bridge phase 3): it reaches Fuseki on the
          # internal network as ct-writer, with its own RDF_PASSWORD. PUT, then DELETE.
          endpoint="$(sed -n 's/^RDF_ENDPOINT=//p' deploy/.env.ci)"
          dataset="$(sed -n 's/^RDF_DATASET=//p' deploy/.env.ci)"
          compose exec -T -e SMOKE_RDF_ENDPOINT="$endpoint" -e SMOKE_RDF_DATASET="${dataset:-ct}" \
            bridge node --input-type=module - <<'EOF'
          import { HttpGraphStore } from '/app/apps/bridge/dist/rdf/store.js';
          const endpoint = process.env.SMOKE_RDF_ENDPOINT;
          if (!endpoint) throw new Error('RDF_ENDPOINT is not set');
          const store = new HttpGraphStore({
            endpoint,
            dataset: process.env.SMOKE_RDF_DATASET,
            user: 'ct-writer',
            password: process.env.RDF_PASSWORD ?? null,
          });
          const graph = 'https://smoke.example/graph';
          await store.put(graph, '<https://smoke.example/s> <https://smoke.example/p> 1 .', 'text/turtle');
          if (!(await store.delete(graph))) throw new Error('the graph was not deleted');
          console.log('ok   triple store: PUT and DELETE as ct-writer, from the bridge');
          EOF
          compose exec -T fuseki /opt/fuseki/admin.sh backup
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml logs --tail=200
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml down -v --remove-orphans
          docker image ls --filter "reference=${IMAGE_PREFIX}/*:${IMAGE_TAG}" -q | xargs -r docker image rm -f

  tag:
    # The build's calendar version (ADR 0014): every merge to main gets the next YYYY.MM.DD.N tag
    # straight away (its PR passed these checks up to date with main; see the top of the file). No concurrency group (it would replace pending jobs): version.mjs retries
    # with the next number when another run took this one.
    name: Tag the build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kenhayward/ingestion-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Tag
        id: tag
        run: |
          tag="$(node deploy/scripts/version.mjs tag)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "### Tagged ${tag}" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  bridge-release:
    # What external sinks build against (delivery bridge design, "How private sinks get it"): the
    # conformance suite as an image, the contract package on GitHub Packages, and the bridge's
    # OpenAPI document on the tag's release.
    name: Bridge contract release assets
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Conformance image
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/ct-bridge-conformance:${TAG}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f deploy/docker/bridge-conformance.Dockerfile -t "${image}" .
          docker push "${image}"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Writes the user-level .npmrc (scope registry + token from NODE_AUTH_TOKEN). npm ignores
          # an .npmrc inside a workspace folder, so the auth must live here, not in the package.
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - name: Contract package on GitHub Packages
        # External sinks install the contract as @<owner>/bridge-contract. A version publishes
        # once: bump packages/bridge-contract/package.json's version when the contract changes.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          npm ci --ignore-scripts
          npm run build -w @ih/bridge-contract
          cd packages/bridge-contract
          node scripts/prepare-publish.mjs "${OWNER}"
          cp ../../LICENSE .
          version=$(node -p "require('./package.json').version")
          if npm view "@${OWNER}/bridge-contract@${version}" version >/dev/null 2>&1; then
            echo "@${OWNER}/bridge-contract@${version} is already published"
          else
            npm publish
          fi
      - name: OpenAPI document on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --notes "Build ${TAG}"
          gh release upload "${TAG}" apps/bridge/openapi.json --clobber
