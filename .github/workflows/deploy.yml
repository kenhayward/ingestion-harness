name: Deploy

on:
  # Auto-deploy main to staging after CI passes.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual deploys / rollbacks to any environment.
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Git ref to deploy (branch, tag or SHA)
        default: main
      no_build:
        description: Skip build and reuse existing images for this ref (rollback)
        type: boolean
        default: false
      untagged:
        description: Build a commit CI has not tagged yet without waiting for the tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # Automatic deploys only for CI runs on pushes to main in this repo (never fork PRs, whose
    # head branch may also be called "main"), and only once a staging runner exists
    # (repository variable AUTO_DEPLOY_STAGING=true).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY_STAGING == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # One runner per environment, installed ON the deploy host with Docker access.
    # Labels: deploy-staging / deploy-production (see docs/runners.md).
    runs-on: [self-hosted, linux, "deploy-${{ inputs.environment || 'staging' }}"]
    environment: ${{ inputs.environment || 'staging' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      # Secrets live on the deploy host, never in the repo or GitHub.
      ENV_FILE: /etc/ingestion-harness/${{ inputs.environment || 'staging' }}.env
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the version (ADR 0014) is worked out from the tags in its history
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Every merge's CI now runs to the end (ci.yml), so runs can finish out of order: an automatic
      # deploy of a commit main has moved past would put older code on staging.
      - name: Skip a superseded commit
        id: current
        if: github.event_name == 'workflow_run'
        run: |
          git fetch -q origin main
          if [[ "$(git rev-parse origin/main)" != "${{ github.event.workflow_run.head_sha }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Skipped: main has moved past $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy
        if: steps.current.outputs.skip != 'true'
        run: |
          args=()
          if [[ "${{ inputs.no_build }}" == "true" ]]; then args+=(--no-build); fi
          if [[ "${{ inputs.untagged }}" == "true" ]]; then args+=(--untagged); fi
          deploy/scripts/deploy.sh "${args[@]}"
      - name: Summary
        if: always()
        run: |
          echo "### Deploy ${DEPLOY_ENV}: $(git rev-parse --short HEAD) — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
