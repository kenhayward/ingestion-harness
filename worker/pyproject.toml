[project]
name = "ingest-worker"
version = "0.1.0"
description = "PDF ingestion worker: segments documents per spec and coordinates LLM extraction."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "anthropic>=0.70",
  "openai>=1.100",
  "boto3>=1.40",
  "psycopg[binary]>=3.2",
  "pypdf>=6.0",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "jsonschema>=4.25",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "httpx>=0.28",
  "cryptography>=44",
  "rdflib>=7.1",
  "pyshacl>=0.40.1",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "defusedxml>=0.7",
]

[project.scripts]
ingest-worker = "ingest_worker.main:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "mypy>=1.17",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.25",
  "types-boto3[s3]>=1.40",
  # The plugin-writing guide's example package (docs/plugins/writing-plugins.md), installed for
  # its tests and the worker's; the image installs plugins only through WORKER_PLUGINS.
  "ct-plugin-example",
  "types-defusedxml>=0.7.0.20260504",
]

[tool.uv.sources]
ct-plugin-example = { path = "plugins/example", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_worker"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/example/tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs Postgres + SeaweedFS (deploy/docker-compose.yml)"]
# rdflib's own JSON-LD parser still builds a ConjunctiveGraph internally.
filterwarnings = ["ignore:ConjunctiveGraph is deprecated:DeprecationWarning:rdflib"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"] # ruff format owns line length; long SQL/f-strings are fine

[tool.ruff.lint.per-file-ignores]
# The Symbol font's table is Greek letters and maths signs that look like Latin ones, on purpose.
"src/ingest_worker/symbol_fonts.py" = ["RUF001"]
"tests/test_symbol_fonts.py" = ["RUF001"]
# So are the maths signs an equation's MathML and LaTeX are written with.
"src/ingest_worker/decompose/equations.py" = ["RUF001"]
"tests/decompose/test_equations.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "plugins/example/src"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
