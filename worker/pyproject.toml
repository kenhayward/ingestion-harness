[project]
name = "ingest-worker"
version = "0.1.0"
description = "PDF ingestion worker: segments documents per spec and coordinates LLM extraction."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "anthropic>=0.70",
  "openai>=1.100",
  "boto3>=1.40",
  "psycopg[binary]>=3.2",
  "pypdf>=6.0",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "jsonschema>=4.25",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "httpx>=0.28",
  "cryptography>=44",
  "rdflib>=7.1",
]

[project.scripts]
ingest-worker = "ingest_worker.main:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "mypy>=1.17",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.25",
  "types-boto3[s3]>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs Postgres + SeaweedFS (deploy/docker-compose.yml)"]
# rdflib's own JSON-LD parser still builds a ConjunctiveGraph internally.
filterwarnings = ["ignore:ConjunctiveGraph is deprecated:DeprecationWarning:rdflib"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"] # ruff format owns line length; long SQL/f-strings are fine

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
