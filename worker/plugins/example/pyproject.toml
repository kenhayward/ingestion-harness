[project]
name = "ct-plugin-example"
version = "1.0.0"
description = "The example recipe plugin of CT Studio's plugin-writing guide: example.label_value@1."
requires-python = ">=3.13"
license = "Apache-2.0"
# Runs inside CT Studio's worker, which provides ingest_worker and pydantic: list only what the
# plugin needs beyond them.
dependencies = []

[project.entry-points."ct_studio.plugins"]
label_value = "ct_plugin_example:LABEL_VALUE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ct_plugin_example"]
