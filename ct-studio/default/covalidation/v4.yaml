format: ct-recipe
formatVersion: 1
instance: default
version:
  number: 4
  status: published
  label: null
  note: null
  labelSetBy: null
  labelSetAt: null
  publishedBy: Ken Hayward
  publishedAt: 2026-10-17T17:24:16.254Z
