    var btn = function (kind) {
      if (kind === 'primary') return { bg: t.accent, fg: t.accentText, bd: t.accent };
      if (kind === 'danger') return { bg: 'transparent', fg: tone.danger.fg, bd: t.borderStrong };
      return { bg: 'transparent', fg: t.text, bd: t.borderStrong };
    };

    var RAW = [
      { id: 'j1', file: 'inv-0043-initech.pdf', type: 'Supplier invoice', version: 'v3', model: 'Spec default', status: 'queued', attempts: 0, when: 'Just now', note: 'Waiting for a worker' },
      { id: 'j2', file: 'coa-lot-7781.pdf', type: 'Certificate of analysis', version: 'v2', model: 'local/qwen3.8-27b-mtp', status: 'running', attempts: 1, when: '1 min ago', note: 'Step 3 of 5 · extracting results table' },
      { id: 'j3', file: 'inv-0042-acme.pdf', type: 'Supplier invoice', version: 'v3', model: 'local/qwen3.8-27b-mtp', status: 'awaiting_review', attempts: 1, when: '6 min ago', note: 'Total does not equal the sum of line items' },
      { id: 'j4', file: 'batch-record-BR2210.pdf', type: 'Batch record', version: 'v1', model: 'anthropic/claude-haiku-5-5', status: 'needs_review', attempts: 1, when: '18 min ago', note: 'Missing section: Deviations' },
      { id: 'j5', file: 'coa-lot-7779.pdf', type: 'Certificate of analysis', version: 'v2', model: 'local/qwen3.8-27b-mtp', status: 'failed', attempts: 3, when: '42 min ago', note: 'Model provider unreachable after 3 attempts' },
      { id: 'j6', file: 'inv-0041-globex.pdf', type: 'Supplier invoice', version: 'v3', model: 'local/qwen3.8-27b-mtp', status: 'succeeded', attempts: 1, when: '1 h ago', note: 'Published · 2 files' },

      return {

        bg: on ? t.text : t.surface, fg: on ? t.bg : t.text, border: on ? t.text : t.border,
        countBg: attn ? tone.warn.bg : (on ? t.muted : tone.neutral.bg), countFg: attn ? tone.warn.fg : (on ? t.bg : tone.neutral.fg),
        pick: function () { self.setState({ filter: c[0] }); }
      };
    });
    var shown = RAW.filter(function (j) { return filter === 'all' || STATUS[j.status].group === filter; });
    var jobs = shown.map(function (j) {
      var s = STATUS[j.status]; var tn = tone[s.tone]; var b = btn(s.kind);
      var noteColor = (s.group === 'attention') ? tn.fg : t.muted;
      return {
        file: j.file, type: j.type, version: j.version, model: j.model, attempts: j.attempts, when: j.when, note: j.note,
        noteColor: noteColor, label: s.label, pillBg: tn.bg, pillFg: tn.fg,
        rowBg: j.id === selId ? t.selRow : 'transparent',
        hasPrimary: !!s.primary, primary: s.primary, btnBg: b.bg, btnFg: b.fg, btnBd: b.bd,
        select: function () { self.setState({ sel: j.id }); },
        act: (j.status === 'awaiting_review' || j.status === 'succeeded') ? go('review') : function () { self.setState({ sel: j.id }); }
      };
    });

    var J = RAW.filter(function (j) { return j.id === selId; })[0] || RAW[2];
    var S = STATUS[J.status]; var ST = tone[S.tone];
    var STEP_NAMES = ['Text & OCR', 'Sections', 'Extraction', 'Validation', 'Review & publish'];
    var PLAN = {
      queued: ['todo', 'todo', 'todo', 'todo', 'todo'],
      running: ['done', 'done', 'current', 'todo', 'todo'],
      awaiting_review: ['done', 'done', 'done', 'done', 'wait'],
      needs_review: ['done', 'fail', 'todo', 'todo', 'todo'],
      failed: ['done', 'done', 'fail', 'todo', 'todo'],
      succeeded: ['done', 'done', 'done', 'done', 'done'],
      rejected: ['done', 'done', 'done', 'done', 'fail'],
      cancelled: ['done', 'todo', 'todo', 'todo', 'todo']

    var steps = PLAN[J.status].map(function (p, i) {

      cancelled: [['Retry', 'primary'], ['Delete', 'danger']]
    };
    var CALLOUT = { awaiting_review: 'Needs a reviewer', needs_review: 'Stopped — operator action needed', failed: 'Failed', running: 'In progress', queued: 'Queued', cancelled: 'Cancelled' };
    var sel = {

    };

    var RRAW = [
      { id: 'r1', file: 'inv-0041-globex.pdf', type: 'Supplier invoice', tid: 'inv', version: 'v3', published: '12 Oct, 08:31', reviewer: 'khd1', issues: 0 },
      { id: 'r2', file: 'coa-lot-7774.pdf', type: 'Certificate of analysis', tid: 'coa', version: 'v2', published: '12 Oct, 06:12', reviewer: 'auto', issues: 0 },
      { id: 'r3', file: 'inv-0040-umbrella.pdf', type: 'Supplier invoice', tid: 'inv', version: 'v3', published: '11 Oct, 16:48', reviewer: 'khd1', issues: 2 },
      { id: 'r4', file: 'batch-record-BR2207.pdf', type: 'Batch record', tid: 'br', version: 'v1', published: '11 Oct, 11:05', reviewer: 'khd1', issues: 1 },
      { id: 'r5', file: 'coa-lot-7770.pdf', type: 'Certificate of analysis', tid: 'coa', version: 'v2', published: '10 Oct, 17:20', reviewer: 'auto', issues: 0 },

      };
    });
    var R = RRAW.filter(function (r) { return r.id === rselId; })[0] || RRAW[0];
    var PREVIEW = {
