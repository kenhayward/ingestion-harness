<span aria-hidden="true" style="flex: none; position: relative; width: 30px; height: 38px; box-sizing: border-box; border: 1.5px solid {{t.borderStrong}}; border-radius: 3px 9px 3px 3px; background: {{t.surface}}; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; font-size: 10px; font-weight: 600; color: {{t.muted}}">{{s.pages}}</span>
<button type="button" onClick="{{s.select}}" aria-label="Show text of {{s.name}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
<span style="flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: {{s.pillBg}}; color: {{s.pillFg}}; font-size: 11px; font-weight: 600">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{s.st.fill}}" stroke="{{s.st.ring}}" stroke-width="1.5"></circle><path d="{{s.st.d}}" stroke="{{s.st.glyph}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{s.stateText}}</span>
</span>
<span style="font-size: 12px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.meta}}</span>
</button>
<span role="group" aria-label="Role of {{s.name}}" style="flex: none; display: flex; gap: 2px; padding: 2px; border: 1px solid {{t.border}}; border-radius: 8px; background: {{t.surface2}}">
<button type="button" aria-pressed="{{s.devPressed}}" onClick="{{s.toDev}}" style="height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: {{s.devBg}}; color: {{s.devFg}}; box-shadow: {{s.devShadow}}; font: inherit; font-size: 12px; cursor: pointer">Dev</button>
<button type="button" aria-pressed="{{s.holdPressed}}" onClick="{{s.toHold}}" style="height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: {{s.holdBg}}; color: {{s.holdFg}}; box-shadow: {{s.holdShadow}}; font: inherit; font-size: 12px; cursor: pointer">Holdout</button>
</span>
<span style="flex: none; display: flex; gap: 4px">
<sc-if value="{{s.canRetry}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Retry {{s.name}}" title="Retry preparation" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid {{t.border}}; border-radius: 7px; background: transparent; color: {{t.text}}; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v4h4"></path></svg></button>
</sc-if>
<button type="button" onClick="{{s.askRemove}}" aria-label="Remove {{s.name}}" title="Remove sample" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid {{t.border}}; border-radius: 7px; background: transparent; color: {{tone.danger.fg}}; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</span>
</div>
<sc-if value="{{s.hasNote}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: flex-start; gap: 6px; margin: -4px 14px 10px 56px; font-size: 12px; font-weight: 500; color: {{s.noteFg}}">{{s.note}}</span>
</sc-if>
<sc-if value="{{s.confirming}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 14px 10px 56px; padding: 8px 12px; border-radius: 8px; background: {{tone.danger.bg}}; color: {{tone.danger.fg}}; font-size: 13px">
<span style="flex: 1 1 200px">Remove {{s.name}}? Its prepared text is deleted.</span>
<button type="button" onClick="{{sm.keep}}" style="height: 30px; padding: 0 10px; border: 1px solid {{t.borderStrong}}; border-radius: 6px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 12px; cursor: pointer">Keep</button>
<button type="button" onClick="{{sm.keep}}" style="height: 30px; padding: 0 10px; border: 1px solid {{tone.danger.fg}}; border-radius: 6px; background: {{tone.danger.fg}}; color: {{t.surface}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">Remove</button>
</div>
</sc-if>
</div>
</sc-for>
</section>
</sc-for>
</div>

<section aria-label="Prepared text of {{sm.sel.name}}" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid {{t.border}}">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sm.sel.name}}</strong><span style="flex: none; font-size: 12px; color: {{t.muted}}">{{sm.sel.chars}}</span></span>
<div role="tablist" aria-label="Pages" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{sm.sel.pages}}" as="pg" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{pg.sel}}" onClick="{{pg.pick}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid {{pg.bd}}; border-radius: 7px; background: {{pg.bg}}; color: {{pg.fg}}; font: inherit; font-size: 12px; font-weight: {{pg.weight}}; cursor: pointer">Page {{pg.n}}<sc-if value="{{pg.ocr}}" hint-placeholder-val="{{ false }}"><span style="padding: 0 5px; border-radius: 4px; background: {{tone.info.bg}}; color: {{tone.info.fg}}; font-size: 10px; font-weight: 700">OCR</span></sc-if></button>
</sc-for>
</div>
</div>
<pre style="margin: 0; padding: 14px 16px; min-height: 320px; max-height: 460px; overflow: auto; background: {{t.codeBg}}; color: {{t.text}}; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap">{{sm.sel.text}}</pre>
<span style="padding: 8px 14px; border-top: 1px solid {{t.borderSoft}}; font-size: 12px; color: {{t.muted}}">{{sm.sel.foot}}</span>
</section>
</div>
</div>
</sc-if>

<sc-if value="{{wb.isBrief}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Brief</h2>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: {{br.stFg}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{br.st.fill}}" stroke="{{br.st.ring}}" stroke-width="1.5" stroke-dasharray="{{br.st.dash}}"></circle><path d="{{br.st.d}}" stroke="{{br.st.glyph}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{br.stText}}</span>
<span style="font-size: 12px; color: {{t.muted}}">Everything you know about this document type, in plain words. The model reads it at every drafting stage; each save is a new version.</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<sc-if value="{{br.dirty}}" hint-placeholder-val="{{ true }}"><span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{tone.warn.fg}}"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: currentColor"></span>Unsaved changes</span></sc-if>
<button type="button" onClick="{{br.discard}}" style="height: 38px; padding: 0 14px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Discard</button>
<button type="button" onClick="{{br.save}}" aria-disabled="{{br.saveDisabled}}" style="height: 38px; padding: 0 16px; border: 1px solid {{br.saveBd}}; border-radius: 8px; background: {{br.saveBg}}; color: {{br.saveFg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{br.saveLabel}}</button>
</div>
</div>

<div role="list" aria-label="Brief completeness" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{br.fields}}" as="f" hint-placeholder-count="6">
<a role="listitem" href="#brief-{{f.key}}" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 8px; border: 1px solid {{t.border}}; border-radius: 999px; background: {{t.surface}}; color: {{t.text}}; text-decoration: none; font-size: 13px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{f.st.fill}}" stroke="{{f.st.ring}}" stroke-width="1.5" stroke-dasharray="{{f.st.dash}}"></circle><path d="{{f.st.d}}" stroke="{{f.st.glyph}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{f.label}}</a>
</sc-for>
<a role="listitem" href="#brief-answers" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 8px; border: 1px solid {{t.border}}; border-radius: 999px; background: {{t.surface}}; color: {{t.text}}; text-decoration: none; font-size: 13px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{br.ansSt.fill}}" stroke="{{br.ansSt.ring}}" stroke-width="1.5" stroke-dasharray="{{br.ansSt.dash}}"></circle><path d="{{br.ansSt.d}}" stroke="{{br.ansSt.glyph}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
Survey answers · 0</a>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px">
<div style="flex: 999 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px">
<sc-for list="{{br.fields}}" as="f" hint-placeholder-count="6">
<div id="brief-{{f.key}}" style="grid-column: {{f.span}}; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid {{f.bd}}; border-radius: 12px; background: {{t.surface}}">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<label for="brief-input-{{f.key}}" style="font-size: 14px; font-weight: 600">{{f.label}}</label>
<span style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: {{t.muted}}"><sc-if value="{{f.edited}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 6px; border-radius: 4px; background: {{tone.warn.bg}}; color: {{tone.warn.fg}}; font-weight: 600">edited</span></sc-if>{{f.count}}</span>
</span>
<span id="brief-hint-{{f.key}}" style="margin-top: -4px; font-size: 12px; color: {{t.muted}}">{{f.hint}}</span>
<textarea id="brief-input-{{f.key}}" aria-describedby="brief-hint-{{f.key}}" rows="{{f.rows}}" onInput="{{f.onInput}}" style="padding: 10px 12px; border: 1px solid {{t.border}}; border-radius: 8px; background: {{t.surface2}}; color: {{t.text}}; font-family: {{f.font}}; font-size: 13px; line-height: 1.55; resize: vertical">{{f.value}}</textarea>
<sc-if value="{{f.isExample}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 500; color: {{t.muted}}">Preview · {{br.csv.summary}}</span>
<div style="border: 1px solid {{t.border}}; border-radius: 8px; overflow-x: auto">
<div style="display: grid; grid-template-columns: repeat({{br.csv.cols}}, minmax(90px, auto)); min-width: max-content; font-size: 12px">
<sc-for list="{{br.csv.cells}}" as="c" hint-placeholder-count="14">
<span style="padding: 6px 10px; border-bottom: 1px solid {{t.borderSoft}}; background: {{c.bg}}; font-weight: {{c.weight}}; font-family: {{c.font}}; white-space: nowrap">{{c.v}}</span>
</sc-for>
</div>
</div>
</div>
</sc-if>
</div>
</sc-for>
<section id="brief-answers" aria-label="Survey answers" style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 16px; border: 1.5px dashed {{tone.warn.fg}}; border-radius: 12px; background: {{tone.warn.bg}}">
<span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 8px; background: {{t.surface}}; color: {{tone.warn.fg}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8"></path></svg></span>
<span style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 2px; font-size: 13px"><strong style="font-weight: 600; color: {{t.text}}">Survey answers</strong><span style="color: {{t.muted}}">None saved yet — the Survey has 4 open questions about things the brief leaves open. Answers you save there are stored here, where every later stage reads them.</span></span>
<a href="#" onClick="{{br.goSurvey}}" style="display: flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; text-decoration: none; font-size: 13px; font-weight: 500">Open Survey</a>
</section>
</div>

<aside aria-label="Brief history and export" style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<section aria-label="Versions" style="display: flex; flex-direction: column; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<span style="padding: 12px 14px; border-bottom: 1px solid {{t.border}}; font-size: 14px; font-weight: 600">Versions</span>
<sc-for list="{{br.versions}}" as="v" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid {{t.borderSoft}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 12px">
<span style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600">{{v.v}}</span><span>{{v.when}}</span><span style="margin-left: auto; font-size: 11px; color: {{v.tagFg}}; font-weight: 600; white-space: nowrap">{{v.tag}}</span></span>
<span style="color: {{t.muted}}">{{v.what}}</span>
</span>
<button type="button" aria-label="Compare {{v.v}} with the current brief" style="height: 28px; padding: 0 8px; border: 1px solid {{t.border}}; border-radius: 6px; background: transparent; color: {{t.text}}; font: inherit; font-size: 12px; cursor: pointer">Compare</button>
</div>
</sc-for>
</section>
<section aria-label="Drafting bundle" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}">
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"></path></svg>Drafting bundle</span>
<span style="font-size: 12px; color: {{t.muted}}">Brief, draft, stage instructions and the dev sample PDFs — never holdout samples — to draft elsewhere or import into another deployment.</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{tone.ok.fg}}; font-weight: 500"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{tone.ok.fg}}"></circle><path d="M6 10.5l2.7 2.7L14 7.8" stroke="{{t.surface}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Export ready · brief v3 · 6 dev PDFs · 3.1 MB</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="#" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; text-decoration: none; font-size: 13px; font-weight: 600"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>Download</a>
<button type="button" style="height: 36px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Export again</button>
</div>
<span style="font-size: 11px; color: {{t.muted}}">Local-only project: downloading needs the admin token.</span>
</section>
</aside>
</div>
</div>
</sc-if>

<sc-if value="{{wb.isSurvey}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Survey</h2>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: {{tone.warn.fg}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{wb.stWarn.fill}}" stroke="{{wb.stWarn.ring}}" stroke-width="1.5"></circle><path d="{{wb.stWarn.d}}" stroke="{{wb.stWarn.glyph}}" stroke-width="2" stroke-linecap="round"></path></svg>
Survey ready — waiting for your decision</span>
<span style="font-size: 12px; color: {{t.muted}}">The model read the 6 ready dev samples and describes what it found, then asks about anything the brief leaves open. Runs on local models; holdout samples are never sent.</span>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v4h4"></path></svg>Run again</button>
<button type="button" style="height: 38px; padding: 0 14px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Skip this stage</button>
</div>
</div>

<div role="note" style="display: flex; gap: 10px; padding: 10px 14px; border-radius: 10px; background: {{tone.skip.bg}}; color: {{t.text}}; font-size: 13px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" style="flex: none; margin-top: 1px"><circle cx="10" cy="10" r="8.25" stroke="{{tone.skip.fg}}" stroke-width="1.5"></circle><path d="M6 10h7M10.4 7l3 3-3 3" stroke="{{tone.skip.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>You skipped this stage on 3 Oct, then ran it again. <strong style="font-weight: 600">Accepting replaces the skip</strong> — Outputs, Sections and Steps were drafted without it and will be marked stale so you can re-propose them.</span>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">

<section aria-label="Questions" style="border: 1.5px solid {{tone.warn.fg}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid {{t.borderSoft}}; background: {{tone.warn.bg}}">
<strong style="font-size: 14px; font-weight: 600; color: {{t.text}}">Questions from the model</strong>
<span style="font-size: 12px; color: {{tone.warn.fg}}; font-weight: 600">{{sv.answeredText}}</span>
<span aria-hidden="true" style="flex: 1 1 120px; max-width: 200px; height: 6px; border-radius: 3px; background: {{t.surface}}; overflow: hidden"><span style="display: block; height: 100%; width: {{sv.answeredPct}}; background: {{tone.warn.fg}}"></span></span>
</div>
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{sv.questions}}" as="q" hint-placeholder-count="4">
<li style="display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid {{t.borderSoft}}">
<span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: {{q.numBg}}; color: {{q.numFg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{q.n}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="sv-q-{{q.n}}" style="font-size: 14px; font-weight: 500">{{q.question}}</label>
<span id="sv-why-{{q.n}}" style="font-size: 12px; color: {{t.muted}}">Why it asks: {{q.why}}</span>
<textarea id="sv-q-{{q.n}}" aria-describedby="sv-why-{{q.n}}" rows="2" placeholder="Your answer — saved to the brief" onInput="{{q.onInput}}" style="padding: 8px 10px; border: 1px solid {{q.bd}}; border-radius: 8px; background: {{t.surface2}}; color: {{t.text}}; font: inherit; font-size: 13px; resize: vertical">{{q.answer}}</textarea>
</div>
</li>
</sc-for>
</ol>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px">
<button type="button" onClick="{{sv.saveAnswers}}" aria-disabled="{{sv.saveDisabled}}" style="height: 38px; padding: 0 14px; border: 1px solid {{sv.saveBd}}; border-radius: 8px; background: {{sv.saveBg}}; color: {{sv.saveFg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{sv.saveLabel}}</button>
<span style="font-size: 12px; color: {{t.muted}}">{{sv.saveNote}}</span>
</div>

<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: {{ev.gateTagBg}}; color: {{ev.gateTagFg}}; font-size: 11px; font-weight: 700"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ev.gateIcon}}"></path></svg>{{ev.gateTag}}</span><strong style="font-size: 15px; font-weight: 600">{{ev.gateTitle}}</strong></span>
<sc-for list="{{ev.meters}}" as="m" hint-placeholder-count="2">
<div style="display: grid; grid-template-columns: 112px minmax(0, 1fr) 56px; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">{{m.label}}</span><span style="font-size: 11px; color: {{t.muted}}">{{m.sub}}</span></span>
<span role="img" aria-label="{{m.a11y}}" style="position: relative; height: 14px; border-radius: 999px; background: {{t.surface2}}; border: 1px solid {{t.borderSoft}}">
<span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{m.pct}}; border-radius: 999px; background: {{m.bar}}"></span>
<span style="position: absolute; left: {{ev.thPct}}; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: {{t.text}}"></span>
</span>
<strong style="font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{m.fg}}; text-align: right">{{m.value}}</strong>
</div>
</sc-for>
<span style="display: grid; grid-template-columns: 112px minmax(0, 1fr) 56px; gap: 12px; font-size: 11px; color: {{t.muted}}"><span></span><span style="position: relative; height: 14px"><span style="position: absolute; left: 0">70%</span><span style="position: absolute; left: {{ev.thPct}}; transform: translateX(-50%); font-weight: 600; color: {{t.text}}">Threshold 90%</span><span style="position: absolute; right: 0">100%</span></span><span></span></span>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 10px; background: {{ev.whyBg}}">
<strong style="font-size: 13px; font-weight: 600">{{ev.whyTitle}}</strong>
<span style="font-size: 13px; color: {{t.text}}">{{ev.why}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="#" onClick="{{ev.goSteps}}" style="display: flex; align-items: center; height: 34px; padding: 0 12px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; text-decoration: none; font-size: 13px; font-weight: 600">Review the Steps proposal</a>
<a href="#" onClick="{{ev.goRevise}}" style="display: flex; align-items: center; height: 34px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; text-decoration: none; font-size: 13px; font-weight: 500">Revise with the model</a>
</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 18px; border-top: 1px solid {{t.borderSoft}}; background: {{t.surface2}}">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px">Publish threshold <input type="number" value="90" min="0" max="100" aria-label="Publish threshold (%)" style="width: 64px; height: 32px; padding: 0 8px; box-sizing: border-box; border: 1px solid {{t.borderStrong}}; border-radius: 6px; background: {{t.surface}}; color: {{t.text}}; font: inherit">%</label>
<span style="font-size: 12px; color: {{t.muted}}">Live: v3 · published 2 Oct at 90%</span>
<span style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{ev.showOverrideBtn}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ev.openOverride}}" style="height: 36px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Publish anyway…</button></sc-if>
<button type="button" disabled="true" title="Locked by the gate" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid {{t.border}}; border-radius: 8px; background: {{t.surface}}; color: {{t.muted}}; font: inherit; font-size: 13px; font-weight: 600; cursor: not-allowed"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Publish v4</button>
</span>
</div>
<sc-if value="{{ev.overrideOpen}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 18px; border-top: 1px solid {{tone.lock.fg}}; background: {{tone.lock.bg}}">
<strong style="font-size: 13px; font-weight: 600; color: {{tone.lock.fg}}">Publish v4 below the threshold</strong>
<span style="font-size: 12px; color: {{t.text}}">The reason is recorded in the publication log with the score (88%). At least 10 characters.</span>
<textarea onInput="{{ev.onReason}}" rows="2" maxlength="1000" aria-label="Override reason" placeholder="e.g. due_date is optional for AP; the other outputs meet the bar" style="width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; resize: vertical">{{ev.reason}}</textarea>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><button type="button" onClick="{{ev.publishOverride}}" disabled="{{ev.ovDisabled}}" style="height: 36px; padding: 0 14px; border: 1px solid {{ev.ovBd}}; border-radius: 8px; background: {{ev.ovBg}}; color: {{ev.ovFg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Publish v4 with override</button><button type="button" onClick="{{ev.closeOverride}}" style="height: 36px; padding: 0 12px; border: 0; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; cursor: pointer">Cancel</button><span style="font-size: 12px; color: {{t.muted}}">{{ev.reasonCount}}</span></span>
</div>
</sc-if>
<sc-if value="{{ev.published}}" hint-placeholder-val="{{ false }}">
<div role="status" style="padding: 12px 18px; border-top: 1px solid {{tone.ok.fg}}; background: {{tone.ok.bg}}; font-size: 13px"><strong style="color: {{tone.ok.fg}}">Published v4 with override</strong> — logged with the score and your reason. <a href="#" onClick="{{ev.undoPublish}}" style="color: {{t.accent}}">Reset demo</a></div>
</sc-if>
</section>

<section aria-label="Run an evaluation" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}">
<strong style="font-size: 14px; font-weight: 600">Run</strong>
<div role="group" aria-label="Set" style="display: flex; padding: 3px; border: 1px solid {{t.border}}; border-radius: 9px; background: {{t.surface2}}">
<sc-for list="{{ev.sets}}" as="s" hint-placeholder-count="2"><button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-size: 13px; font-weight: 500; box-shadow: {{s.shadow}}; cursor: pointer">{{s.label}}</button></sc-for>
</div>
<label style="display: flex; align-items: center; gap: 6px; font-size: 13px">Model <select aria-label="Model" style="height: 34px; padding: 0 8px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px"><option>Template's models</option><option>default</option><option>fast</option><option>draft</option></select></label>
<label style="display: flex; align-items: center; gap: 6px; font-size: 13px"><input type="checkbox" style="width: 16px; height: 16px; accent-color: {{t.accent}}">Fresh model calls</label>
<span style="font-size: 12px; color: {{t.muted}}">{{ev.setNote}}</span>
<span style="margin-left: auto; display: flex; gap: 8px">
<button type="button" disabled="{{ev.cmpDisabled}}" title="{{ev.cmpTitle}}" style="height: 36px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{ev.cmpFg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Compare models</button>
<button type="button" style="height: 36px; padding: 0 14px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{ev.runLabel}}</button>
</span>
</section>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px">
<section aria-label="Run results" style="flex: 1 1 560px; min-width: 0; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid {{t.borderSoft}}">
<strong style="font-size: 14px; font-weight: 600">{{ev.run.title}}</strong>
<span style="font-size: 12px; color: {{t.muted}}">{{ev.run.meta}}</span>
</div>
<sc-for list="{{ev.run.samples}}" as="r" hint-placeholder-count="6">
<div onClick="{{r.pick}}" style="display: grid; grid-template-columns: 170px minmax(80px, 1fr) 44px 190px; align-items: center; gap: 14px; padding: 9px 16px; box-sizing: border-box; border-bottom: 1px solid {{t.borderSoft}}; border-left: 3px solid {{r.edge}}; background: {{r.bg}}; cursor: pointer">
<button type="button" aria-pressed="{{r.on}}" style="padding: 0; border: 0; background: none; color: {{t.text}}; text-align: left; cursor: pointer; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</button>
<span aria-hidden="true" style="position: relative; height: 8px; border-radius: 999px; background: {{t.surface2}}"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{r.pct}}; border-radius: 999px; background: {{r.bar}}"></span><span style="position: absolute; left: {{ev.thPct}}; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: {{t.muted}}"></span></span>
<strong style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{r.fg}}; text-align: right">{{r.score}}</strong>
<span style="font-size: 12px; color: {{t.muted}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.misses}}</span>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 0; padding: 14px 16px 6px">
<span style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 8px"><strong style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 13px; font-weight: 600">{{ev.det.name}}</strong><span style="font-size: 12px; color: {{t.muted}}">{{ev.det.meta}}</span><a href="#" style="margin-left: auto; font-size: 12px; color: {{t.accent}}">Open in Review</a></span>
<sc-if value="{{ev.det.sealed}}" hint-placeholder-val="{{ true }}"><span style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 10px; border-radius: 8px; background: {{tone.skip.bg}}; color: {{tone.skip.fg}}; font-size: 12px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"></path></svg>Holdout is sealed: you can see the differences, but comments are off so nothing from it reaches the model in Revise.</span></sc-if>
<div role="table" aria-label="Fields in {{ev.det.name}}" style="display: grid; grid-template-columns: minmax(100px, auto) minmax(0, 1fr) minmax(0, 1fr) 28px auto; column-gap: 12px; font-size: 13px">
<span role="columnheader" style="padding: 6px 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{t.muted}}; border-bottom: 1px solid {{t.border}}">Output</span><span role="columnheader" style="padding: 6px 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{t.muted}}; border-bottom: 1px solid {{t.border}}">Reference</span><span role="columnheader" style="padding: 6px 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{t.muted}}; border-bottom: 1px solid {{t.border}}">This run</span><span role="columnheader" style="padding: 6px 0; border-bottom: 1px solid {{t.border}}"></span><span role="columnheader" style="padding: 6px 0; border-bottom: 1px solid {{t.border}}"></span>
<sc-for list="{{ev.det.rows}}" as="f" hint-placeholder-count="10">
<span style="padding: 7px 0; border-bottom: 1px solid {{t.borderSoft}}; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: {{t.muted}}">{{f.id}}</span>
<span style="padding: 7px 0; border-bottom: 1px solid {{t.borderSoft}}; min-width: 0; overflow-wrap: anywhere">{{f.exp}}</span>
<span style="padding: 7px 0; border-bottom: 1px solid {{t.borderSoft}}; min-width: 0; overflow-wrap: anywhere; color: {{f.actFg}}; font-weight: {{f.actW}}">{{f.act}}</span>
<span aria-label="{{f.matchLabel}}" style="padding: 7px 0; border-bottom: 1px solid {{t.borderSoft}}; color: {{f.mFg}}; font-weight: 700; text-align: center">{{f.m}}</span>
<span style="padding: 4px 0; border-bottom: 1px solid {{t.borderSoft}}; display: flex; justify-content: flex-end"><sc-if value="{{f.canComment}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{f.comment}}" style="height: 26px; padding: 0 8px; border: 1px solid {{t.border}}; border-radius: 6px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 12px; cursor: pointer">Comment</button></sc-if></span>
<sc-if value="{{f.commenting}}" hint-placeholder-val="{{ false }}">
<div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; padding: 10px 12px; margin: 6px 0; border-radius: 8px; background: {{t.accentSoft}}">
<label style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: {{t.accentSoftText}}">Comment on {{f.id}} — goes to Revise as feedback for the model<textarea rows="2" style="width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid {{t.borderStrong}}; border-radius: 6px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px">{{f.draft}}</textarea></label>
<button type="button" onClick="{{ev.saveComment}}" style="height: 34px; padding: 0 12px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Save comment</button>
</div>
</sc-if>
</sc-for>
</div>
<sc-if value="{{ev.commentSaved}}" hint-placeholder-val="{{ false }}"><span role="status" style="margin: 10px 0 4px; font-size: 12px; color: {{tone.ok.fg}}">Comment saved — <a href="#" onClick="{{ev.goRevise}}" style="color: {{t.accent}}">see Revise</a> (2 comments waiting)</span></sc-if>
</div>
</section>

<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section aria-label="Accuracy by output" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}">
<span style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px"><strong style="font-size: 14px; font-weight: 600">Accuracy by output</strong><span style="font-size: 12px; color: {{t.muted}}">{{ev.accNote}}</span></span>
<sc-for list="{{ev.acc}}" as="a" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 96px; align-items: center; gap: 10px">
<span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.id}}</span>
<span aria-hidden="true" style="height: 8px; border-radius: 999px; background: {{t.surface2}}"><span style="display: block; width: {{a.pct}}; height: 100%; border-radius: 999px; background: {{a.bar}}"></span></span>
<span style="font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; color: {{a.fg}}"><strong style="font-weight: 600">{{a.p}}</strong> · {{a.n}}</span>
</div>
</sc-for>
<span style="font-size: 12px; color: {{t.muted}}">{{ev.accRest}}</span>
</section>

<section aria-label="History" style="border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; padding: 12px 16px 6px"><strong style="font-size: 14px; font-weight: 600">History</strong><span style="display: flex; gap: 12px; font-size: 11px; color: {{t.muted}}"><span style="display: inline-flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; background: {{tone.info.fg}}"></span>Dev</span><span style="display: inline-flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; background: {{tone.skip.fg}}"></span>Holdout</span></span></div>
<div role="img" aria-label="Scores by iteration; threshold 90%" style="position: relative; display: flex; align-items: flex-end; gap: 10px; height: 110px; margin: 6px 16px 0; padding-bottom: 1px; border-bottom: 1px solid {{t.border}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: {{ev.thBottom}}; border-top: 1.5px dashed {{t.text}}; opacity: 0.55"></span>
<sc-for list="{{ev.bars}}" as="b" hint-placeholder-count="7"><span title="{{b.title}}" style="flex: 1; height: {{b.h}}; border-radius: 4px 4px 0 0; background: {{b.bg}}; opacity: {{b.op}}"></span></sc-for>
</div>
<div style="display: flex; gap: 10px; margin: 4px 16px 10px"><sc-for list="{{ev.bars}}" as="b" hint-placeholder-count="7"><span style="flex: 1; text-align: center; font-size: 10px; color: {{t.muted}}; font-variant-numeric: tabular-nums">{{b.label}}</span></sc-for></div>
<ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid {{t.borderSoft}}">
<sc-for list="{{ev.hist}}" as="h" hint-placeholder-count="7">
<li style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 44px auto; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid {{t.borderSoft}}; font-size: 12px">
<span style="font-weight: 600">v{{h.v}}</span>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0"><span style="padding: 0 6px; border-radius: 4px; background: {{h.setBg}}; color: {{h.setFg}}; font-size: 10px; font-weight: 700">{{h.set}}</span><span>{{h.model}}</span><span style="color: {{t.muted}}">{{h.when}}</span></span>
<strong style="font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; color: {{h.fg}}">{{h.score}}</strong>
<button type="button" title="Replace the open draft with the template from this run" style="height: 26px; padding: 0 8px; border: 1px solid {{t.border}}; border-radius: 6px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 11px; cursor: pointer">Restore</button>
</li>
</sc-for>
</ul>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 16px 12px">
<strong style="font-size: 12px; font-weight: 600">Publications</strong>
<sc-for list="{{ev.pubs}}" as="p" hint-placeholder-count="3"><span style="font-size: 12px; color: {{t.muted}}"><strong style="color: {{t.text}}; font-weight: 600">v{{p.v}}</strong> · {{p.when}} · {{p.score}}<sc-if value="{{p.hasOv}}" hint-placeholder-val="{{ false }}"> · <span style="color: {{tone.lock.fg}}">override: {{p.ov}}</span></sc-if></span></sc-for>
</div>
</section>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{wb.isRevise}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 820px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Revise</h2>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: {{rv.stFg}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{rv.st.fill}}" stroke="{{rv.st.ring}}" stroke-width="1.5" stroke-dasharray="{{rv.st.dash}}"></circle><path d="{{rv.st.d}}" stroke="{{rv.st.glyph}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{rv.stText}}</span>
<span style="font-size: 12px; color: {{t.muted}}">The model reads your open feedback and the dev samples that scored below 100%, then proposes changes to outputs, sections or steps. You pick which to apply. Holdout results are never sent.</span>
</div>

<sc-if value="{{rv.isReady}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border: 1px solid {{tone.warn.fg}}; border-radius: 12px; background: {{tone.warn.bg}}">
<span style="flex: 1 1 380px; font-size: 13px"><strong style="font-weight: 600; color: {{tone.warn.fg}}">Steps has an open proposal.</strong> It adds <code style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px">due_date</code> — the biggest failure below. Decide it first so this revision doesn't spend itself proposing the same fix.</span>
<a href="#" onClick="{{rv.goSteps}}" style="display: flex; align-items: center; height: 34px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; text-decoration: none; font-size: 13px; font-weight: 500">Open Steps</a>
</div>
</sc-if>

<section aria-label="What the model will see" style="border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 18px; border-bottom: 1px solid {{t.borderSoft}}">
<span style="display: flex; flex-direction: column; gap: 2px; margin-right: auto"><strong style="font-size: 14px; font-weight: 600">What the model will see</strong><span style="font-size: 12px; color: {{t.muted}}">{{rv.sendSummary}}</span></span>
<sc-if value="{{rv.isReady}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{rv.ask}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>Ask the model for a revision</button></sc-if>
</div>

</div>
</sc-for>

</span>
<select aria-label="Which {{rv.targetLabel}}" style="height: 30px; padding: 0 6px; border: 1px solid {{t.borderStrong}}; border-radius: 6px; background: {{t.surface}}; color: {{t.text}}; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px"><sc-for list="{{rv.ids}}" as="o" hint-placeholder-count="5"><option>{{o}}</option></sc-for></select>
</span>
<span style="display: flex; gap: 8px; align-items: flex-end"><textarea rows="2" aria-label="Feedback" placeholder="What should change, in plain words" style="flex: 1; box-sizing: border-box; padding: 6px 8px; border: 1px solid {{t.borderStrong}}; border-radius: 6px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; resize: vertical"></textarea><button type="button" style="height: 34px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Add</button></span>
</form>
</div>
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 12px 18px 8px"><strong style="font-size: 13px; font-weight: 600">Failures from the latest dev run</strong><span style="font-size: 12px; color: {{t.muted}}">v4 · 12 Oct 09:02 · 6 of 6 below 100%</span></div>
<sc-for list="{{rv.fails}}" as="x" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 4px 10px; padding: 8px 18px; border-top: 1px solid {{t.borderSoft}}">
<span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; font-weight: 500">{{x.name}}</span>
<strong style="font-size: 12px; font-weight: 600; text-align: right; color: {{x.fg}}">{{x.score}}</strong>
<span style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{x.diffs}}" as="d" hint-placeholder-count="2"><span title="{{d.title}}" style="padding: 1px 7px; border-radius: 5px; background: {{t.codeBg}}; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; color: {{d.fg}}">{{d.text}}</span></sc-for>
</span>
</div>
</sc-for>
<span style="display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 10px 18px; border-top: 1px solid {{t.borderSoft}}; font-size: 12px; color: {{tone.skip.fg}}; background: {{tone.skip.bg}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"></path></svg>Not sent: the holdout run (88%) and its 2 samples.</span>
</div>
</div>
</section>

<sc-if value="{{rv.isRunning}}" hint-placeholder-val="{{ false }}">
<section aria-label="Revision running" role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 16px 18px; border: 1px solid {{tone.info.fg}}; border-radius: 12px; background: {{tone.info.bg}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="{{tone.info.fg}}" stroke-width="2" stroke-dasharray="30 20"></circle></svg>
<span style="flex: 1 1 320px; font-size: 13px"><strong style="font-weight: 600">The model is drafting a revision</strong> · local/qwen3.8-27b-mtp · usually under a minute. You can leave this tab.</span>
<button type="button" onClick="{{rv.showProposal}}" style="height: 34px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; cursor: pointer">Demo: show the proposal</button>
</section>
</sc-if>

<sc-if value="{{rv.isProposed}}" hint-placeholder-val="{{ false }}">
<section aria-label="Proposal" style="border: 1.5px solid {{tone.warn.fg}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">

<span style="font-size: 12px; color: {{t.muted}}"><span style="font-family: 'IBM Plex Mono', Consolas, monospace">local/qwen3.8-27b-mtp</span> · answers 3 feedback items · based on dev run 12 Oct 09:02</span>
</div>

<input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" aria-label="Apply: {{c.id}}" style="flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: {{t.accent}}">

<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px"><span style="padding: 1px 7px; border-radius: 5px; background: {{tone.info.bg}}; color: {{tone.info.fg}}; font-size: 10px; font-weight: 700">CHANGED</span><span style="padding: 1px 7px; border-radius: 5px; background: {{tone.neutral.bg}}; color: {{tone.neutral.fg}}; font-size: 10px; font-weight: 700">{{c.kind}}</span><strong style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 13px; font-weight: 600">{{c.id}}</strong><span style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 11px; color: {{t.muted}}">Answers<span style="width: 20px; height: 20px; border-radius: 50%; background: {{t.accentSoft}}; color: {{t.accentSoftText}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 700">{{c.answers}}</span></span></span>

<button type="button" onClick="{{rv.reset}}" style="height: 36px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; cursor: pointer">Reset demo</button>

</section>

</div>

<button type="button" onClick="{{tp.goRuns}}" style="height: 36px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Test run</button>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">

<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: {{t.muted}}">Max attempts<input value="3" style="height: 36px; padding: 0 10px; border: 1px solid {{t.border}}; border-radius: 8px; background: {{t.surface2}}; color: {{t.text}}; font: inherit; font-size: 13px"></label>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px"><legend style="padding: 0; margin-bottom: 6px; font-size: 12px; font-weight: 500; color: {{t.muted}}">Reads sections</legend>

</span>

<select aria-label="Add an output" style="height: 28px; padding: 0 6px; border: 1px dashed {{t.borderStrong}}; border-radius: 999px; background: transparent; color: {{t.text}}; font: inherit; font-size: 12px"><option>+ Add output…</option><option>due_date (not filled yet)</option></select>
</span></div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: {{t.muted}}">Instructions <span style="font-weight: 400">Added to the preamble for this step only.</span>

<span style="display: flex; flex-wrap: wrap; gap: 4px 16px; padding-top: 10px; border-top: 1px solid {{t.borderSoft}}; font-size: 12px; color: {{t.muted}}"><span>Last 18 runs:</span><sc-for list="{{tp.step.stats}}" as="m" hint-placeholder-count="4"><span>{{m.k}} <strong style="font-weight: 600; color: {{m.fg}}">{{m.v}}</strong></span></sc-for></span>
</section>
</div>

<sc-if value="{{tp.isList}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<sc-for list="{{tp.list}}" as="l" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: minmax(140px, 1fr) minmax(0, 2fr) auto; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid {{t.borderSoft}}">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 13px; font-weight: 500"><sc-if value="{{l.hasDot}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{l.dot}}"></span></sc-if>{{l.id}}</span>
<span style="font-size: 12px; color: {{t.muted}}; font-family: {{l.font}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{l.detail}}</span>
<span style="padding: 1px 7px; border-radius: 5px; background: {{l.tagBg}}; color: {{l.tagFg}}; font-size: 10px; font-weight: 700; white-space: nowrap">{{l.tag}}</span>
</div>
</sc-for>
<div style="padding: 10px 16px; font-size: 12px; color: {{t.muted}}">{{tp.listNote}} <a href="#" onClick="{{tp.listGo}}" style="color: {{t.accent}}">{{tp.listGoLabel}}</a></div>
</div>
</sc-if>

<sc-if value="{{tp.isYaml}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<pre style="margin: 0; padding: 14px 16px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.codeBg}}; color: {{t.text}}; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12.5px; line-height: 1.6; overflow-x: auto">{{tp.yaml}}</pre>
<span style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" style="height: 36px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; cursor: pointer">Apply YAML</button><span style="align-self: center; font-size: 12px; color: {{t.muted}}">Applying replaces the form; nothing is saved until you save the draft.</span></span>
</div>
</sc-if>
</div>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<section aria-label="Checks" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid {{tp.chkBd}}; border-radius: 12px; background: {{t.surface}}">
<strong style="font-size: 14px; font-weight: 600">Checks</strong>
<sc-for list="{{tp.issues}}" as="i" hint-placeholder-count="2"><span style="display: flex; gap: 8px; font-size: 13px"><span aria-hidden="true" style="flex: none; margin-top: 5px; width: 8px; height: 8px; border-radius: 50%; background: {{i.dot}}"></span><span>{{i.text}} <sc-if value="{{i.hasGo}}" hint-placeholder-val="{{ false }}"><a href="#" onClick="{{i.go}}" style="color: {{t.accent}}">{{i.goLabel}}</a></sc-if></span></span></sc-for>
</section>
<section aria-label="Changes since v3" style="display: flex; flex-direction: column; gap: 0; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 16px 8px"><strong style="font-size: 14px; font-weight: 600">Changes since v3</strong><a href="#" style="font-size: 12px; color: {{t.accent}}">Full diff</a></span>
<sc-for list="{{tp.log}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 3px; padding: 9px 16px; border-top: 1px solid {{t.borderSoft}}">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="padding: 1px 7px; border-radius: 5px; background: {{g.bg}}; color: {{g.fg}}; font-size: 10px; font-weight: 700">{{g.by}}</span><span style="font-size: 11px; color: {{t.muted}}">{{g.when}}</span></span>
<span style="font-size: 12px">{{g.what}}</span>
<sc-if value="{{g.hasDiff}}" hint-placeholder-val="{{ false }}"><span style="width: fit-content; max-width: 100%; box-sizing: border-box; padding: 2px 6px; border-radius: 5px; background: {{t.codeBg}}; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; color: {{tone.info.fg}}; overflow-wrap: anywhere">{{g.diff}}</span></sc-if>
</div>
</sc-for>
</section>
</aside>
</div>

<sc-if value="{{tp.dirty}}" hint-placeholder-val="{{ false }}">
<div role="region" aria-label="Unsaved changes" style="position: sticky; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border: 1px solid {{tone.warn.fg}}; border-radius: 12px; background: {{t.surface}}; box-shadow: 0 6px 24px rgba(0,0,0,0.18)">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; margin-right: auto"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{tone.warn.fg}}"></span><strong style="font-weight: 600">Unsaved change to step {{tp.step.id}}</strong><span style="color: {{t.muted}}">Saving marks the 12 Oct evaluations out of date.</span></span>
<button type="button" onClick="{{tp.discard}}" style="height: 36px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; cursor: pointer">Discard</button>
<button type="button" onClick="{{tp.save}}" style="height: 36px; padding: 0 16px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Save draft v4</button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{wb.isRuns}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 760px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Test runs</h2>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: {{rn.stFg}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{rn.st.fill}}" stroke="{{rn.st.ring}}" stroke-width="1.5"></circle><path d="{{rn.st.d}}" stroke="{{rn.st.glyph}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{rn.stText}}</span>
<span style="font-size: 12px; color: {{t.muted}}">Runs draft v4 on prepared dev samples so you can look at the results in Review. Test runs aren't scored (Evaluate compares with references), holdout samples are never used, and runs queue behind production jobs.</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<button type="button" onClick="{{rn.run}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"></path></svg>Run on {{rn.pickN}} dev samples</button>
</div>
</div>

<section aria-label="Choose samples" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}">
<span style="font-size: 13px; font-weight: 600; margin-right: 4px">Samples</span>
<sc-for list="{{rn.picks}}" as="p" hint-placeholder-count="8">
<label title="{{p.title}}" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid {{p.bd}}; border-radius: 999px; background: {{p.bg}}; color: {{p.fg}}; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; cursor: {{p.cursor}}"><input type="checkbox" checked="{{p.on}}" disabled="{{p.disabled}}" onChange="{{p.toggle}}" style="width: 14px; height: 14px; margin: 0; accent-color: {{t.accent}}">{{p.name}}</label>
</sc-for>
<span style="margin-left: auto; font-size: 12px; color: {{t.muted}}">Queue: 3 production jobs ahead · about 2 min</span>
</section>

<sc-for list="{{rn.batches}}" as="b" hint-placeholder-count="2">
<section aria-label="{{b.title}}" style="border: 1px solid {{b.bd}}; border-radius: 12px; background: {{t.surface}}; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid {{t.borderSoft}}">
<span style="display: flex; flex-direction: column; gap: 2px; margin-right: auto"><strong style="font-size: 14px; font-weight: 600">{{b.title}}</strong><span style="font-size: 12px; color: {{t.muted}}">{{b.meta}}</span></span>
<span role="img" aria-label="{{b.a11y}}" style="display: flex; width: 220px; height: 10px; border-radius: 999px; overflow: hidden; background: {{t.surface2}}"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="4"><span style="width: {{g.w}}; background: {{g.c}}"></span></sc-for></span>
<span style="display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px"><sc-for list="{{b.counts}}" as="c" hint-placeholder-count="4"><span style="display: inline-flex; align-items: center; gap: 5px; color: {{t.muted}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: {{c.c}}"></span>{{c.n}} {{c.label}}</span></sc-for></span>
</div>
<sc-for list="{{b.rows}}" as="r" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 190px 150px minmax(0, 1fr) 64px 80px; align-items: center; gap: 14px; padding: 9px 16px; border-bottom: 1px solid {{t.borderSoft}}">
<span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; width: fit-content; height: 24px; padding: 0 9px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>{{r.status}}</span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 12px; color: {{r.detailFg}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.detail}}</span>
<sc-if value="{{r.hasSteps}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="display: flex; gap: 3px"><sc-for list="{{r.steps}}" as="s" hint-placeholder-count="3"><span title="{{s.id}}" style="flex: 1; max-width: 60px; height: 5px; border-radius: 3px; background: {{s.c}}"></span></sc-for></span></sc-if>
</span>
<span style="font-size: 12px; color: {{t.muted}}; text-align: right; font-variant-numeric: tabular-nums">{{r.time}}</span>
<span style="text-align: right"><sc-if value="{{r.canReview}}" hint-placeholder-val="{{ false }}"><a href="#" style="font-size: 12px; font-weight: {{r.reviewW}}; color: {{t.accent}}">{{r.reviewLabel}}</a></sc-if><sc-if value="{{r.canRetry}}" hint-placeholder-val="{{ false }}"><button type="button" style="height: 26px; padding: 0 8px; border: 1px solid {{t.border}}; border-radius: 6px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 12px; cursor: pointer">Retry</button></sc-if></span>
</div>
</sc-for>
</section>
</sc-for>
<span style="font-size: 12px; color: {{t.muted}}">Older batches: 4 more on v3 and v4 · <a href="#" style="color: {{t.accent}}">Show</a></span>
</div>
</sc-if>

<sc-if value="{{wb.isOther}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">{{wb.cur.title}}</h2>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: {{wb.cur.stFg}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.25" fill="{{wb.cur.st.fill}}" stroke="{{wb.cur.st.ring}}" stroke-width="1.5" stroke-dasharray="{{wb.cur.st.dash}}"></circle><path d="{{wb.cur.st.d}}" stroke="{{wb.cur.st.glyph}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{wb.cur.stText}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 280px; padding: 24px; border: 1.5px dashed {{t.borderStrong}}; border-radius: 12px; background: {{t.surface}}; text-align: center">
<code style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 13px; color: {{t.text}}">{{wb.cur.component}}</code>
<span style="max-width: 460px; font-size: 13px; color: {{t.muted}}">The existing tab content renders here, restyled with the app tokens. Its status icon in the side rail and its box on the Overview map update as this stage changes.</span>
</div>
</div>
</sc-if>

</section>
</div>
</div>
</sc-if>

<sc-if value="{{isAccess}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div>
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.015em">Access</h1>
<p style="margin: 4px 0 0; color: {{t.muted}}">People sign in with an access token. Issue a token per person or machine; revoking one ends its sessions immediately.</p>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 16px">
<form aria-label="New token" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Issue a token</h2>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px">
<label style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: {{t.muted}}">Label
<input placeholder="e.g. Ken – laptop" maxlength="100" style="height: 40px; padding: 0 10px; border: 1px solid {{t.border}}; border-radius: 8px; background: {{t.surface2}}; color: {{t.text}}; font: inherit; font-size: 14px"></label>
<fieldset style="flex: 0 1 auto; margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 4px; font-size: 12px; font-weight: 500; color: {{t.muted}}">Expires after</legend>
<div style="display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid {{t.border}}; border-radius: 9px; background: {{t.surface2}}">
<sc-for list="{{acc.expiry}}" as="x" hint-placeholder-count="6">
<button type="button" aria-pressed="{{x.pressed}}" onClick="{{x.pick}}" style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: {{x.bg}}; color: {{x.fg}}; box-shadow: {{x.shadow}}; font: inherit; font-size: 13px; cursor: pointer">{{x.label}}</button>
</sc-for>
</div>
</fieldset>
<button type="button" onClick="{{acc.create}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-weight: 500; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
Create token
</button>
</div>
</form>
<aside aria-label="About the admin token" style="flex: 1 1 280px; min-width: 0; box-sizing: border-box; display: flex; gap: 12px; padding: 18px 20px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface2}}">
<span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 8px; background: {{tone.info.bg}}; color: {{tone.info.fg}}; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<strong style="font-weight: 600">The admin token rotates</strong>
<span style="color: {{t.muted}}">It changes on every API restart and is printed in the API log. Use it to get in, then issue user tokens here.</span>
</div>
</aside>
</div>

<sc-if value="{{acc.showNew}}" hint-placeholder-val="{{ true }}">
<div role="region" aria-label="New token" style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border: 1.5px solid {{tone.ok.fg}}; border-radius: 12px; background: {{tone.ok.bg}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: {{tone.ok.fg}}; color: {{t.surface}}; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<strong style="font-weight: 600; color: {{tone.ok.fg}}">Token created for “CI regression runner”</strong>
<span style="font-size: 13px; color: {{t.text}}">Copy it now — this is the only time it will be shown.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<label style="flex: 1 1 360px; min-width: 0; display: flex">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">New token for CI regression runner</span>
<input readonly value="ihu_9fK2mQ7vXr4LpT8wZ3nB6yHc1dJ5sA0e" style="flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 14px; letter-spacing: 0.02em">
</label>
<button type="button" onClick="{{acc.copy}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 1px solid {{t.accent}}; border-radius: 8px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>
{{acc.copyLabel}}
</button>
<button type="button" onClick="{{acc.done}}" style="height: 44px; padding: 0 16px; border: 1px solid {{t.borderStrong}}; border-radius: 8px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-weight: 500; cursor: pointer">Done</button>
</div>
<p role="status" style="margin: 0; font-size: 12px; color: {{t.muted}}">{{acc.copyNote}}</p>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 12px">
<div role="group" aria-label="Filter tokens by status" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{acc.chips}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 14px; border: 1px solid {{c.border}}; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">
{{c.label}}
<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{c.countBg}}; color: {{c.countFg}}; font-size: 12px; display: flex; align-items: center; justify-content: center">{{c.count}}</span>
</button>
</sc-for>
</div>
<section aria-label="Access tokens" style="border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; overflow-x: auto">
<div style="min-width: 1000px">
<div style="display: grid; grid-template-columns: minmax(200px, 2fr) 80px 116px minmax(130px, 1.2fr) 110px 130px 170px; gap: 12px; padding: 10px 16px; border-bottom: 1px solid {{t.border}}; font-size: 12px; font-weight: 500; color: {{t.muted}}">
<span>Label</span><span>Role</span><span>Created</span><span>Expires</span><span>Last used</span><span>Status</span><span style="text-align: right">Actions</span>
</div>
<sc-for list="{{acc.tokens}}" as="k" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: minmax(200px, 2fr) 80px 116px minmax(130px, 1.2fr) 110px 130px 170px; gap: 12px; align-items: center; padding: {{rowPad}} 16px; border-bottom: 1px solid {{t.borderSoft}}; background: {{k.rowBg}}">
<span style="display: flex; flex-direction: column; gap: 2px; min-height: 40px; justify-content: center; min-width: 0">
<span style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{k.label}}</span>
<span style="font-size: 12px; color: {{k.subFg}}">{{k.sub}}</span>
</span>
<span style="width: fit-content; padding: 2px 8px; border-radius: 5px; background: {{k.roleBg}}; color: {{k.roleFg}}; font-size: 12px; font-weight: 500">{{k.role}}</span>
<span style="font-size: 13px; color: {{t.muted}}">{{k.created}}</span>
<span style="display: flex; flex-direction: column; font-size: 13px"><span>{{k.expires}}</span><span style="font-size: 12px; color: {{k.expFg}}; font-weight: {{k.expWeight}}">{{k.expRel}}</span></span>
<span style="font-size: 13px; color: {{t.muted}}">{{k.used}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 3px 10px; border-radius: 999px; background: {{k.pillBg}}; color: {{k.pillFg}}; font-size: 12px; font-weight: 500"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>{{k.status}}</span>
<span style="display: flex; justify-content: flex-end; gap: 6px">
<sc-if value="{{k.idle}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{k.canRevoke}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{k.askRevoke}}" style="height: 34px; padding: 0 12px; border: 1px solid {{t.borderStrong}}; border-radius: 7px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Revoke</button>
</sc-if>
<sc-if value="{{k.canDelete}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="Delete {{k.label}}" onClick="{{k.askDelete}}" style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid {{t.borderStrong}}; border-radius: 7px; background: transparent; color: {{tone.danger.fg}}; cursor: pointer">

<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>

<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5h.01"></path></svg>

</sc-if>
<button type="submit" onClick="{{goJobs}}" style="height: 46px; border: 1px solid {{t.accent}}; border-radius: 9px; background: {{t.accent}}; color: {{t.accentText}}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Sign in</button>
</form>
<p style="margin: 0; text-align: center; font-size: 13px; color: {{t.muted}}; text-wrap: pretty">Ask an administrator for an access token.<br>Administrators: the admin token is printed in the API log on each restart.</p>
</div>
</div>
</div>
</sc-if>
</div>
</script>
<script>
// Minimal renderer for the design's template syntax: {{path}} holes, <sc-if>, <sc-for>, onClick.
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }

class Component extends DCLogic {
  renderVals() {

    var LIGHT = {
      bg: '#F3F5F8', surface: '#FFFFFF', surface2: '#F6F8FB', border: '#DCE2EA', borderSoft: '#E9EDF2', borderStrong: '#B4BFCD',
      text: '#0F1B2D', muted: '#4F5D70', accent: '#0A5BB0', accentText: '#FFFFFF', accentSoft: '#E4EEFA', accentSoftText: '#0A4F99',

    };
    var DARK = {
      bg: '#0B1119', surface: '#121A25', surface2: '#0E151F', border: '#243041', borderSoft: '#1B2532', borderStrong: '#3A4B62',
      text: '#E5EBF2', muted: '#9DABBD', accent: '#5EA3EE', accentText: '#061321', accentSoft: '#15283E', accentSoftText: '#A9CDF7',
      selRow: '#15233A', segActive: '#22324A', segShadow: 'none',
      pageWell: '#070B11', paper: '#DCE2E9', paperInk: '#B3BDCA', codeBg: '#0E151F', boxFill: 'rgba(10,91,176,0.14)', flow: '#6FB0F5', side: '#3DD6C2', band: 'rgba(255,255,255,0.035)', bandBd: '#2A374A'
    };
    var TL = {
      neutral: { bg: '#ECEFF3', fg: '#46546A' }, info: { bg: '#E4EEFA', fg: '#0A4F99' }, warn: { bg: '#FCF0DA', fg: '#7A4300' },

      skip: { bg: '#EDE8FB', fg: '#5B3BB0' }, lock: { bg: '#FBE6F0', fg: '#9B1D58' }

    var t = mode === 'dark' ? DARK : LIGHT;
    var tone = mode === 'dark' ? TD : TL;
    var screen = st.screen || this.props.screen || 'jobs';
    var rowPad = (this.props.density === 'compact') ? '6px' : '10px';

    var go = function (s) { return function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState({ screen: s }); }; };
    var setTheme = function (m) { return function () { self.setState({ theme: m }); }; };

    var segFor = function (m) {
      var on = themePref === m;
      return { pressed: on ? 'true' : 'false', bg: on ? t.segActive : 'transparent', fg: on ? t.text : t.muted, shadow: on ? t.segShadow : 'none' };
    };
    var PARENT = { home: 'home', jobs: 'jobs', review: 'jobs', results: 'results', types: 'types', editor: 'types', access: 'access', workbench: 'workbench', wblist: 'workbench' };

      failed: { label: 'Failed', tone: 'danger', primary: 'Retry', kind: 'secondary', group: 'attention' },
      succeeded: { label: 'Succeeded', tone: 'ok', primary: 'View', kind: 'secondary', group: 'done' },
