<!doctype html>
<!--
  Shown by sw.js when a page load cannot reach the server (docs/design/pwa.md). Self-contained:
  the network is gone when it shows, so it loads nothing. Colours are the light and dark tokens of
  src/styles/tokens.css; the theme follows the app's choice (ih.theme) like src/theme.ts.
  Bump CACHE in sw.js when this file changes.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · CT Studio</title>
    <script>
      try {
        var theme = localStorage.getItem('ih.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {
        // storage blocked: follow the OS
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f8;
        --surface: #ffffff;
        --border: #dce2ea;
        --text: #0f1b2d;
        --muted: #4f5d70;
        --accent: #0a5bb0;
        --accent-text: #ffffff;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0b1119;
        --surface: #121a25;
        --border: #243041;
        --text: #e5ebf2;
        --muted: #9dabbd;
        --accent: #5ea3ee;
        --accent-text: #061321;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          color-scheme: dark;
          --bg: #0b1119;
          --surface: #121a25;
          --border: #243041;
          --text: #e5ebf2;
          --muted: #9dabbd;
          --accent: #5ea3ee;
          --accent-text: #061321;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 'IBM Plex Sans',
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        text-align: center;
      }
      svg {
        display: block;
        margin: 0 auto 16px;
      }
      .tile {
        fill: var(--accent);
      }
      .glyph {
        stroke: var(--accent-text);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      button {
        min-height: 40px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true">
        <rect class="tile" width="64" height="64" rx="14" />
        <path
          class="glyph"
          d="M46 17A21 21 0 1 0 46 47"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
        />
        <path
          class="glyph"
          d="M28 28h8v8h-8z"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
        />
      </svg>
      <h1>CT Studio can't reach the server</h1>
      <p>Check your network connection. If it is working, the server may be restarting.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
